<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UVS Engine — 飛鳥 vs 柳生</title>
<style>
:root{--bg:#14161c;--panel:#1e2129;--panel2:#262a35;--line:#3a3f4d;--fg:#e8e9ee;--dim:#9aa0b0;
 --yo:#d9534f;--in:#3b7dd8;--sen:#d8a62a;--hi:#4caf50;--hiden:#9b59b6;--acc:#f0c15c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.45}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;flex:1}
header button{font-size:12px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.primary{background:#3a5bbf;border-color:#4a6bd0}
button:disabled{opacity:.4}
.board{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.board.me{background:#1a1d26}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.name{font-weight:700}
.stat{color:var(--dim);font-size:12px}
.stat b{color:var(--fg);font-size:13px}
.chip{display:inline-block;padding:2px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.chip.yo{border-color:var(--yo)}.chip.in{border-color:var(--in)}
.chip.dmg{border-color:#c0392b}
.chip.chain{border-color:#4caf50}.chip.chain.on{background:#1f3a24}.chip.chain.ban{border-color:#e53935;background:#3a1f1f;color:#ff8a80}
.banmsg{margin-top:4px;padding:3px 8px;border-radius:6px;font-size:12px;background:#3a1f1f;border:1px solid #e53935;color:#ff8a80}
.needs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}.needs span{padding:2px 8px;border-radius:6px;font-size:12px;border:1px solid var(--line)}
.needs .lit{color:#fff;border-color:#4caf50;background:#2e5e35;font-weight:700}.needs .off{opacity:.35}
.arena{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.battle{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;min-height:60px}
.side{flex:1;background:var(--panel2);border-radius:10px;padding:6px;min-height:60px}
.side h4{margin:0 0 4px;font-size:12px;color:var(--dim)}
.side .tot{font-size:18px;font-weight:700}
.hand{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;-webkit-overflow-scrolling:touch}
.card{flex:0 0 auto;width:92px;min-height:88px;border-radius:8px;border:2px solid var(--line);background:#2c3040;padding:5px 6px;font-size:11px;position:relative;cursor:pointer}
.card.small{width:78px;min-height:64px;font-size:10px}
.card .nm{font-weight:700;font-size:12px;line-height:1.2;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:12px}
.card .gp{color:var(--dim)}
.card .ic{color:var(--acc);letter-spacing:1px;font-weight:700}
.card .ty{position:absolute;top:3px;right:5px;font-size:9px;color:var(--dim)}
.card.c閃{border-color:var(--sen)}.card.c陽{border-color:var(--yo)}.card.c陰{border-color:var(--in)}.card.c飛{border-color:var(--hi)}.card.c秘{border-color:var(--hiden)}
.card.sel{box-shadow:0 0 0 3px #fff inset;background:#3a4258}
.card.dis{opacity:.35}
.card.dimu{opacity:.5;filter:saturate(.4)}
.card.back{background:repeating-linear-gradient(45deg,#333 0 6px,#444 6px 12px);border-color:#555}
#actions{padding:10px 10px calc(10px + 44px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:5}
#actions .title{font-weight:700;margin-bottom:6px}
#actions .btns{display:flex;flex-wrap:wrap;gap:6px}
.log{font-size:12px;color:var(--dim);max-height:120px;overflow:auto;background:var(--panel2);border-radius:8px;padding:6px 8px;white-space:pre-wrap}
.log .hl{color:var(--fg)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:20;overflow:auto;padding:16px}
#overlay.on{display:flex;align-items:center;justify-content:center}
.ov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.ov h2{margin:0 0 10px;font-size:17px}
.ov label{display:block;margin:6px 0}
.ov .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.detail{font-size:13px}
.detail dt{color:var(--dim);font-size:11px;margin-top:6px}
.sup{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;border:1px dashed var(--line);margin-right:4px}
.small{font-size:12px;color:var(--dim)}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}

/* v1.5 UI readability patch: portrait dimensions preserved */
.char-panel{display:flex;align-items:center;gap:8px;margin-top:5px;min-width:0}
.char-identity{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.char-identity .chip{font-weight:700;white-space:nowrap}
.char-numbers{display:flex;gap:5px;flex-shrink:0}
.power{min-width:72px;padding:3px 7px;border-radius:8px;background:#292f3b;border:1px solid #4a5262;text-align:center;font-variant-numeric:tabular-nums}
.power.atk{border-color:#b45d59}.power.def{border-color:#5584bb}
.power.atk .power-label{color:#ff7777}.power.def .power-label{color:#75b7ff}
.power .power-label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:#d4d9e5}
.power .power-num{display:block;font-size:18px;line-height:1.18;font-weight:800;color:#fff}
/* 一の位から回転する桁別オドメーター */
.power .power-num{display:flex;justify-content:center;align-items:center;white-space:nowrap;overflow:hidden}
.power .od-digit{position:relative;display:inline-block;width:.62em;height:1.18em;overflow:hidden;vertical-align:top}
.power .od-strip{display:flex;flex-direction:column;align-items:center;will-change:transform}
.power .od-cell{display:block;height:1.18em;line-height:1.18em;text-align:center}
.power .power-delta{font-size:10px;color:#ffcb82;min-height:12px}
.power.changed{animation:power-pulse .38s ease-out}
@keyframes power-pulse{0%{transform:scale(1.1);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
.hand{scroll-snap-type:x proximity;scroll-padding:8px;gap:8px;padding:9px 2px 10px}
.hand .card{scroll-snap-align:start}
.card{width:104px;min-height:103px;padding:8px 6px 6px;border-radius:9px}
.card .nm{font-size:13px;white-space:normal;overflow:visible;overflow-wrap:anywhere;min-height:28px;padding-right:10px}
.card .st{font-size:13px;font-weight:800;white-space:nowrap}
.card .gp{font-size:11px;line-height:1.35}
.card .ic{font-size:12px}
.card.sel{box-shadow:0 0 0 2px #fff inset,0 0 12px #779bff;background:#3a4258}
.card.small{width:80px;min-height:70px;padding:5px;font-size:10px}
.card.small .nm{font-size:11px;min-height:0}
#actions .hand{max-height:140px}
.battle .tot{font-variant-numeric:tabular-nums}
@media(max-width:375px){.power{min-width:64px;padding:3px 4px}.power .power-num{font-size:16px}.char-panel{gap:4px}.card{width:98px}}
@media(prefers-reduced-motion:reduce){.power.changed{animation:none}}
/* v1.6 UI: デュエルリンクス風。相手は上で小さく、自分は下。ATK/DEFの横にそのバトルの札。ターン・フェイズ演出 */
header{padding:4px 8px;gap:5px;flex-wrap:wrap}
header h1{font-size:12px;flex:none;white-space:nowrap}
header button{font-size:11px;padding:4px 7px}
header button:disabled{opacity:.35}
#autostat{font-size:10px;flex-basis:100%;text-align:right;margin-top:-2px}
#autostat:empty{display:none}
.board{transition:box-shadow .3s,border-color .3s;border-left:4px solid transparent}
.board.turn.mine{border-left-color:#4a7dff;box-shadow:inset 0 0 18px rgba(74,125,255,.18)}
.board.turn.theirs{border-left-color:#e05252;box-shadow:inset 0 0 18px rgba(224,82,82,.18)}
.board.op{padding:5px 8px}
.board.op .row{gap:4px 9px}
.minihand{display:inline-flex;align-items:center;gap:0;margin-left:2px}
.minihand i{display:inline-block;width:11px;height:16px;border-radius:2px;border:1px solid #666;background:repeating-linear-gradient(45deg,#3a3a3a 0 3px,#4a4a4a 3px 6px);margin-left:-4px}
.minihand i:first-child{margin-left:0}
.minihand b{margin-left:4px;font-size:13px}
.char-panel{align-items:flex-start}
.bslot{display:flex;align-items:flex-start;gap:0;min-height:0}
.bslot .card.small{width:74px;min-height:62px;padding:4px 5px}
.bslot .card.small .nm{font-size:10.5px}
.bslot .card.small .gp{display:none}
.bslot .card.small .st{font-size:10.5px;letter-spacing:-.03em;white-space:nowrap}
.bslot .card.small .ty{font-size:8px}
.bslot .card.small .nm{padding-right:8px}
.bslot .hv{margin-left:-34px;transform:translateY(8px)}
.bslot .wait{font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:8px;width:70px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center}
.power{cursor:pointer}
.mid{padding:4px 8px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.phasebar{display:flex;gap:4px;justify-content:center;align-items:center}
.phasebar span{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.phasebar .who{border:none;font-weight:700;padding:2px 4px}
.phasebar.mine .on{background:#3a5bbf;border-color:#6d8cff;color:#fff;font-weight:700}
.phasebar.theirs .on{background:#a33a3a;border-color:#ff7b7b;color:#fff;font-weight:700}
.phasebar.mine .who{color:#8fb0ff}.phasebar.theirs .who{color:#ff9a9a}
.result{text-align:center;font-weight:800;font-size:15px}
.mid .log{max-height:38px;font-size:11px;padding:3px 8px;cursor:pointer}
#banner{position:fixed;left:0;right:0;top:38%;z-index:30;pointer-events:none;display:none;text-align:center}
#banner.on{display:block}
#banner .band{margin:0 auto;padding:14px 0;font-size:24px;font-weight:900;letter-spacing:.08em;color:#fff;animation:band-in var(--bd,900ms) ease-out forwards}
#banner .band small{display:block;font-size:12px;font-weight:600;letter-spacing:0;opacity:.85}
#banner.mine .band{background:linear-gradient(90deg,transparent,rgba(58,91,191,.95) 15%,rgba(58,91,191,.95) 85%,transparent)}
#banner.theirs .band{background:linear-gradient(90deg,transparent,rgba(170,50,50,.95) 15%,rgba(170,50,50,.95) 85%,transparent)}
#banner.phase .band{font-size:18px;padding:8px 0}
@keyframes band-in{0%{transform:translateX(60%);opacity:0}18%{transform:translateX(0);opacity:1}78%{transform:translateX(0);opacity:1}100%{transform:translateX(-60%);opacity:0}}
@media(prefers-reduced-motion:reduce){#banner .band{animation:none}}
/* テキストで強化された数値：通常は細字、強化分を含む値だけ太字＋色 */
.card .st{font-weight:500}
.card .st b.up{font-weight:900;color:#ffd36b}
/* 連撃条件の印（準備フェイズ） */
.card .needb{display:inline-block;align-self:flex-start;margin:0 0 3px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;background:#2e7d32;border:1px solid #66bb6a}
/* 手札：縦長にしてテキストも表示 */
.board.me .hand .card.big{width:124px;min-height:168px;display:flex;flex-direction:column}
.card.big .tx{margin-top:4px;padding-top:4px;border-top:1px solid #3e4454;font-size:10.5px;line-height:1.35;color:#c9cfdb;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.big .tx:empty{display:none}
.card.big .ic{min-height:0}

#cardpeek{position:fixed;inset:0;z-index:24;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:14px 14px 130px}
#cardpeek .cardpeek-panel{pointer-events:auto;width:min(310px,100%);max-height:calc(100dvh - 185px);overflow:auto;background:#1e2129;border:1px solid #78829b;border-radius:14px;padding:14px;box-shadow:0 12px 60px #000c}
#cardpeek .card{width:100%;min-height:0;font-size:14px;cursor:default;padding:12px}
#cardpeek .card .nm{font-size:18px;white-space:normal;padding-right:24px}
#cardpeek .card .tx{display:block;font-size:14px;line-height:1.65;white-space:normal}
#cardpeek .cardpeek-hint{font-size:11px;color:var(--dim);margin:10px 0 0}
.hiden-cost{width:min(520px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);overflow:hidden}
.hiden-cost[open]{display:flex;flex-direction:column}
.hiden-cost::backdrop{background:#000b}
.hiden-cost header,.hiden-cost footer{flex:none;padding:10px 14px;background:var(--panel2)}
.hiden-cost header{display:block;position:static}
.hiden-cost h2,.hiden-cost h3{margin:0 0 6px}
.hiden-cost footer button{width:100%;min-height:44px}
.hiden-cost-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 14px}
.hiden-cost-grid{display:grid;grid-template-columns:repeat(2,minmax(0,184px));gap:8px;margin:0 0 14px}
.hiden-cost-entry{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:start;gap:4px}
.hiden-cost-card{position:relative;text-align:left;padding:0;min-width:0}
.hiden-cost-card .card{width:100%;height:104px;min-height:0}
.hiden-cost-card .nm{min-height:2.4em;white-space:normal;overflow-wrap:anywhere;padding-right:12px}
.hiden-cost-card .st{white-space:normal}
.hiden-cost-card[aria-pressed="true"]{outline:3px solid var(--acc);outline-offset:1px}
.hiden-cost-card[aria-pressed="true"]::after{content:"✓";position:absolute;right:4px;top:4px;border-radius:50%;background:var(--acc);color:var(--bg);padding:0 4px}
.hiden-cost-info{min-height:44px;padding:0}
.hiden-cost [hidden]{display:none}
</style>
<style>
/* v1.8 新UI（2026-11-06）：モック https://claude.ai/artifact/2916UR435Sqh5DB9wBAGLw の配置 */
#app.nv{height:100vh;height:100dvh;min-height:0;max-width:520px;padding:4px 8px 8px;gap:5px;overflow:hidden}
.nv-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.nv-bar button{padding:3px 8px;font-size:11px;min-height:28px}
.nv-bar .sp{flex:1}
.nv-opbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--dim);min-height:22px}
.nv-turn{font-weight:700;color:var(--fg)}
.nv-turn.mine{color:#9cc2ff}.nv-turn.theirs{color:#ff9f8a}
.nv-backs{display:flex;gap:2px;align-items:center}.nv-backs i{display:block;width:10px;height:15px;border-radius:2px;background:#3a4150;border:1px solid #586074}
.nv-backs b{font-size:15px;color:var(--fg);margin-left:4px}
.nv-row{display:flex;align-items:center;gap:6px}
.nv-power{display:flex;flex-direction:column;gap:0;cursor:pointer;padding:2px 6px;border-radius:8px;border:2px solid transparent;min-width:92px}
.nv-power.right{align-items:flex-end}
.nv-power .who{font-size:10px;color:var(--dim)}
.nv-power .power{display:flex;align-items:baseline;gap:5px;background:none;border:0;padding:0;margin:0}
.nv-power .power-label{font-size:12px;font-weight:800;letter-spacing:.06em}
.nv-power .power.atk .power-label{color:#ff8a5b}.nv-power .power.def .power-label{color:#6fa8ff}
.nv-power .power-num{font-size:28px;font-weight:800;line-height:1}
.nv-power .power-delta{font-size:11px;color:var(--acc);min-width:0}
.nv-power.hl.atk{border-color:#ff8a5b}.nv-power.hl.def{border-color:#6fa8ff}
.nv-gval{display:flex;flex-direction:column;cursor:pointer}
.nv-gval.right{align-items:flex-end}
.nv-gval .who{font-size:10px;color:var(--dim)}
.nv-gval .v{display:flex;gap:8px;font-size:17px;font-weight:800}
.nv-gval .y{color:#f07a55}.nv-gval .n{color:#6a9cf0}
.nv-info{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 6px;display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--dim)}
.nv-info .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.nv-info b{color:var(--fg);font-size:12px}
.nv-info .z{cursor:pointer}
.nv-info .gr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv-info .gr .lit{color:#4cd07d;font-weight:700}.nv-info .gr .off{color:#7d8496}
.nv-info .gr.ban{color:#ff8a80}
.nv-mid{flex:1;min-height:0;display:flex;gap:6px}
.nv-gs{display:flex;gap:3px;align-self:flex-end;height:50dvh;max-height:100%}
.nv-gs.opp{align-self:flex-start}
.nv-g{width:38px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.nv-g .h{font-size:10px;font-weight:700;text-align:center}
.nv-g.yo .h{color:#f07a55}.nv-g.in .h{color:#6a9cf0}
.nv-g .col{flex:1;min-height:2px;border-radius:6px;padding:2px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.nv-g.yo .col{border:1px solid #d9534f66;background:#d9534f14}.nv-g.in .col{border:1px solid #3b7dd866;background:#3b7dd814}
.nv-g .stub{flex:0 0 auto;height:18px;border-radius:3px;background:var(--panel);font-size:8.5px;line-height:18px;color:var(--dim);padding-left:3px;white-space:nowrap;overflow:hidden;border-left:4px solid var(--sen)}
.nv-g .stub.c陽{border-left-color:var(--yo)}.nv-g .stub.c陰{border-left-color:var(--in)}.nv-g .stub.cx{border-left-color:#777}
.nv-center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;position:relative}
.nv-char{width:100%;max-width:150px;flex:1 1 0;min-height:64px;max-height:160px;border-radius:10px;background:#252a35;border:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer}
.nv-char.flip{transform:rotate(180deg)}
.nv-char .t{display:flex;justify-content:space-between;align-items:baseline}
.nv-char .t b{font-size:14px}.nv-char .t span{font-size:11px;color:var(--acc);font-weight:700}
.nv-char .s{font-size:12px;font-weight:700}
.nv-char .x{font-size:9.5px;color:var(--dim);line-height:1.3;overflow:hidden}
.nv-char .sup{font-size:9px;color:var(--acc)}
.nv-char.lit{box-shadow:0 0 0 2px var(--acc),0 0 16px #f0c15c88}
.nv-vs{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.nv-battle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:#0d0f14e8;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;width:max-content;max-width:100%}
.nv-battle .cs{display:flex;gap:6px;align-items:flex-start}
.nv-battle .side{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--dim)}
.nv-battle .card{width:66px;min-height:62px}
.nv-battle .wait{width:66px;min-height:62px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px}
.nv-battle .res{font-size:13px;font-weight:800}
.nv-choice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#0d0f14f2;border:1px solid var(--acc);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:96%}
.nv-choice .q{font-size:12px;text-align:center}
.nv-choice .bs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.nv-choice button{min-height:44px;padding:6px 12px}
.nv-choice .cards{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-height:40vh;overflow:auto}

.nv-pass.primary{background:#3a3520}
.nv-banmsg{font-size:10px;color:#ff8a80}
.nv-bar{flex-wrap:nowrap;overflow:hidden}
.nv-bar button{padding:2px 6px;white-space:nowrap}
#autostat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nv-hand .card .st{font-size:11px;letter-spacing:-.02em}
.nv-hand .card .st b{font-size:11px}
.nv-hand .card.picked{transform:translateY(-14px);box-shadow:0 0 0 3px #fff,0 0 18px #fff8}

.nv-char.picked{box-shadow:0 0 0 3px #fff,0 0 20px #f0c15c}
.nv-prompt .pk{color:var(--acc)}
.nv-hand{padding-top:16px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}

<script>
'use strict';
/* =========================================================
   UVS Engine (Unlimited VS 再現・汎用エンジン試作)
   閃乱カグラ版ルール + 本チャットでの決定事項
   ========================================================= */
const CONFIG = {
  ruleVersion:'1.11',      // ルール・カードの版（2026-11-07 v1.11：先攻の1ターン目もバトルできる／LOした側の負け（旧ルール）／緑の巻物はダメージ2枚ごとに1枚ドロー。v1.8：緑5枚を前提2種・AT+700に、欺人脚の重撃アイコン削除、凪・怨砂の発動しない文を削除）
  loRule:'lose',           // LO（ドローフェイズ開始時に山札0枚）の扱い：'lose'＝LOした側の負け（v1.11）／'compare'＝ダメージエリアの枚数を比べ、同数ならLO側の負け（v1.6〜1.10）
  deckSize:40, startHand:4, drawPerTurn:2, firstTurnDraw:1, firstTurnBattle:true,
  winDamage:5, tieWinner:'attacker', noDefenseAutoHit:true,
  greenDefense:'free',   // 緑の防御: 'free'=条件なしで出せ相手が緑なら無条件成功 / 'needs'=攻撃時と同じ前提条件が必要（満たせば無条件成功） / 'none'=緑は防御に出せない
  blowHeavy:true,        // 吹飛が相手の重撃も封じるか（falseならテキスト無効のみ）
  heavy:{ firstNeedsIcon:false, ignoreGP:true, maxCards:99, endMode:'bothPass' },
  aiNoHopelessHeavy:false, // true＝AI（人間は対象外）は手札の重撃札をすべて足しても勝てない時は重撃しない（2026-11-07追加）。v1.11の正本AIでは該当0枚と確認済みのため既定は切る（乱数の消費が変わり過去の結果と1局単位で比べられなくなる）。確認は chk_heavywaste.js
};
let UID=0;
const yo=p=>p.gYo.length, inn=p=>p.gIn.length, gaugeAll=p=>[...p.gYo,...p.gIn];
const sleep=ms=>ms>0?new Promise(r=>setTimeout(r,ms)):Promise.resolve();

/* ---------- カード定義 ---------- */
const CARDS={};
function B(name,id,color,gy,gi,at,df,tech,icons,o={}){if(/[^RU]/.test(icons))throw new Error(`アイコンはR（連撃）とU（重撃）だけ：${name}「${icons}」`);const ic=[...new Set(icons.split(''))];CARDS[name]=Object.assign({type:'battle',name,id,color,gp:{yo:gy,in:gi},at,df,dp:1,tech,icons:ic},o);}
function S(name,id,color,gy,gi,o){CARDS[name]=Object.assign({type:'support',name,id,color,gp:{yo:gy,in:gi}},o);}
const D1=p=>{draw(p,1);};
// --- 飛鳥デッキのバトルカード ---
B('凪','B001','閃',1,0,200,400,'斬撃','R',{text:'（テキストなし）'}); // v1.8：「凪」の連撃から使用時AT+200 を削除（連撃の追加バトルは緑だけなので発動しなかった）
B('省刃','B006','閃',0,1,300,300,'斬撃','U',{text:'（テキストなし）'});
B('連刃','B009','閃',0,1,300,200,'斬撃','R',{text:'【強化】陽・陰ゲージがともに3枚以上の時、DF+300',mod:c=>yo(c.me)>=3&&inn(c.me)>=3?{df:300}:null});
B('飛塵','B011','閃',1,1,300,300,'斬撃','R',{text:'【閃乱】陽・陰ゲージがともに5枚以上の時、DF+500',mod:c=>yo(c.me)>=5&&inn(c.me)>=5?{df:500}:null});
B('リミットブレイク','B019','閃',3,3,1000,1000,'波動','',{text:'【使用条件】バトル開始時、自分の山札の上から2枚を捨て札にする。【対抗】相手のバトルカードが秘伝忍法の時DF+400。【制限】ディフェンス時、相手はそのバトルで連撃を使用できない',costMill:2,revealCost:true,onReveal:c=>{mill(c.me,2,'リミットブレイク');},mod:c=>c.oppCard&&c.oppCard.color==='秘'?{df:400}:null,flags:c=>!c.isAtk?{noOppRenzen:true}:null});
B('砂風車','B020','陽',2,0,300,400,'斬撃','R',{text:'【対抗】相手が打撃の時DF+200',mod:c=>c.oppCard&&c.oppCard.tech==='打撃'?{df:200}:null});
B('捌き連刃','B025','陽',3,0,500,400,'斬撃','R',{text:'【対抗】相手が防御の時AT+200。【陽乱】陽ゲージ5枚以上でAT+200',mod:c=>({at:(c.oppCard&&c.oppCard.tech==='防御'?200:0)+(yo(c.me)>=5?200:0)})});
B('旋空砂','B030','陽',5,0,600,400,'斬撃','RU',{only:'飛鳥',text:'飛鳥専用。【強化】このバトル中、自分の重撃1枚につきAT+200',mod:c=>({at:200*c.heavy.length})});
B('冥砂','B035','陰',0,2,400,400,'斬撃','R',{text:'【強化】陰ゲージ3枚以上でDF+200',mod:c=>inn(c.me)>=3?{df:200}:null});
B('怨砂','B040','陰',0,3,500,500,'斬撃','U',{text:'【陰乱】陰ゲージ5枚以上でDF+300',mod:c=>inn(c.me)>=5?{df:300}:null}); // v1.8：「冥砂」の連撃からAT+200 を削除（発動しなかった）
B('攻断円','B041','陰',0,3,700,300,'斬撃','U',{noHeavy:true,text:'【対抗】アタック時、両プレイヤーは重撃を使用できない。【制限】重撃には使用できない',flags:c=>c.isAtk?{noHeavyBoth:true}:null});
B('志昇陣','B045','陰',0,5,1000,200,'斬撃','R',{only:'飛鳥',text:'飛鳥専用。【対抗】相手のバトルカードが陽属性の時DF+400。【陰乱】陰ゲージ7枚以上でDF+500',mod:c=>({df:(c.oppCard&&c.oppCard.color==='陽'?400:0)+(inn(c.me)>=7?500:0)})});
B('右空','B050','飛',0,0,700,0,'斬撃','R',{only:'飛鳥',needs:['凪','飛塵'],text:'飛鳥専用・緑。【使用条件（攻撃時）】忍ゲージに「凪」「飛塵」がある。【吹飛】アタック時、相手はバトルカードのテキストと重撃を使用できない（緑を除く）。【連撃防御】ディフェンスに出した時、相手が緑なら無条件で防御成功',flags:c=>c.isAtk?{noOppText:true,noOppHeavy:true}:null});
B('二刀繚斬','B055','秘',4,4,1400,1200,'召喚','',{dp:2,only:'飛鳥',hiden:true,text:'飛鳥専用・秘伝忍法。【使用条件】陽4/陰4、さらに忍ゲージから閃・陽・陰のカードを1枚ずつ捨て札。【強化】忍ゲージの斬撃カード1枚につきAT+100/DF+100。【巻込】アタックして勝利したとき、相手は手札を1枚捨てる',mod:c=>{const n=gaugeAll(c.me).filter(x=>x.tech==='斬撃').length;return{at:100*n,df:100*n}},onWin:c=>oppDiscard(c,1)});
// --- 柳生デッキのバトルカード ---
B('散り傘','B038','陰',0,2,300,400,'打撃','RU',{text:'【強化】このバトル中、重撃で重ねた「散り傘」1枚につきAT+100',mod:c=>({at:100*c.heavy.filter(x=>x.name==='散り傘').length})});
B('狂い傘','B033','陽',5,0,600,400,'射撃','RU',{only:'柳生',text:'柳生専用。【対抗】相手のバトルカードが陰属性の時DF+400。【手札強化】アタックして勝利したとき、1ドロー',mod:c=>c.oppCard&&c.oppCard.color==='陰'?{df:400}:null,onWin:c=>{draw(c.me,1);log(`${c.me.name}：狂い傘で1ドロー`)}});
B('踊り傘','B023','陽',2,0,200,200,'射撃','RU',{text:'【手札強化】アタックして勝利したとき、1ドロー',onWin:c=>{draw(c.me,1);log(`${c.me.name}：踊り傘で1ドロー`)}});
B('残月','B043','陰',0,3,600,400,'斬撃','U',{text:'【強化】このバトル中、自分の重撃1枚につきDF+100。【陰乱】陰ゲージ5枚以上でDF+300',mod:c=>({df:100*c.heavy.length+(inn(c.me)>=5?300:0)})});
B('狭朱','B026','陽',3,0,400,300,'斬撃','RU',{text:'【対抗】ディフェンス時、相手は重撃を使用できない',flags:c=>!c.isAtk?{noOppHeavy:true}:null});
B('天刃','B004','閃',1,0,300,300,'斬撃','U',{text:'（テキストなし）'});
B('零雹','B014','閃',1,1,300,300,'波動','R',{text:'【巻込】ディフェンスして勝利したとき、相手が使用したバトルカードを捨て札にする。【閃乱】陽・陰ゲージがともに5枚以上でDF+500',mod:c=>yo(c.me)>=5&&inn(c.me)>=5?{df:500}:null,onDefWin:c=>{c.bs.oppCardToDiscard=true;log(`零雹：相手のバトルカードは捨て札になる`)}});
B('諸行の音','B053','飛',0,0,700,0,'斬撃','R',{only:'柳生',needs:['連刃','零雹'],text:'柳生専用・緑。【使用条件（攻撃時）】忍ゲージに「連刃」「零雹」がある。【吹飛】アタック時、相手はバトルカードのテキストと重撃を使用できない（緑を除く）。【連撃防御】ディフェンスに出した時、相手が緑なら無条件で防御成功',flags:c=>c.isAtk?{noOppText:true,noOppHeavy:true}:null});
B('開華','B028','陽',3,0,400,300,'斬撃','RU',{text:'【強化】このバトル中、重撃で重ねた「開華」1枚につきAT+200。【陽乱】陽ゲージ5枚以上でAT+200',mod:c=>({at:200*c.heavy.filter(x=>x.name==='開華').length+(yo(c.me)>=5?200:0)})});
B('返し雨','B048','陰',0,5,700,300,'斬撃','RU',{only:'柳生',text:'柳生専用。【強化】このバトル中、重撃で重ねた射撃カード1枚につきAT+200。【手札強化】アタックして勝利したとき、1ドロー',mod:c=>({at:200*c.heavy.filter(x=>x.tech==='射撃').length}),onWin:c=>{draw(c.me,1);log(`${c.me.name}：返し雨で1ドロー`)}});
B('くぐつダミー','B017','閃',1,1,0,500,'防御','',{dp:0,text:'【対抗】相手が斬撃または打撃の時DF+200。【対抗】相手のバトルカードのDPが2以上の時、そのDP−1',mod:c=>c.oppCard&&['斬撃','打撃'].includes(c.oppCard.tech)?{df:200}:null,dpMod:c=>(!c.isAtk&&c.oppCard&&c.oppCard.dp>=2)?-1:0});
B('薙ぎ払う足','B058','秘',4,4,1300,1300,'召喚','',{dp:2,only:'柳生',hiden:true,text:'柳生専用・秘伝忍法。【使用条件】陽4/陰4、さらに忍ゲージから閃・陽・陰のカードを1枚ずつ捨て札。【強化】手札が5枚以上の時AT+500/DF+500。【巻込】アタックして勝利したとき、相手は手札を1枚捨てる',mod:c=>c.me.hand.length>=5?{at:500,df:500}:null,onWin:c=>oppDiscard(c,1)});
// --- サポート ---
S('緑の巻物','S001','閃',1,1,{scrollMode:1,text:'【使用型】自分のダメージエリアの枚数2枚ごとに1枚ドロー。効果の適用後、すぐに陰ゲージへ',use:async c=>{const n=Math.floor(c.me.damage.length/2);draw(c.me,n);log(`${c.me.name}：緑の巻物で${n}ドロー`)},dest:'in',expire:'now'});
S('赤の巻物','S002','閃',2,2,{text:'【使用型】自分のキャラ1枚をダメージエリアへ送り、2ドロー。効果の適用後すぐに陽か陰のゲージへ（選べる）',canUse:p=>p.charDeck.length>=2,use:async c=>{await applyDamage(c.me,1,'赤の巻物');draw(c.me,2);log(`${c.me.name}：赤の巻物で2ドロー`)},dest:'choose',expire:'now'});
S('牛乳','S003','陽',3,3,{text:'【使用型】ダメージエリアにある最もレベルの高いキャラカード1枚をキャラエリアの一番上に戻す。すぐに陽ゲージへ',canUse:p=>p.damage.some(x=>x.type==='char'),use:async c=>{const cs=c.me.damage.filter(x=>x.type==='char').sort((a,b)=>b.lv-a.lv);const ch=cs[0];c.me.damage.splice(c.me.damage.indexOf(ch),1);const prevTop=c.me.charDeck[0];c.me.charDeck.unshift(ch);ev('V',c.me.idx,{direction:'down',from:{uid:prevTop?prevTop.uid:null,lv:prevTop?prevTop.lv:null},to:{uid:ch.uid,lv:ch.lv,at:ch.at,df:ch.df},moved:ch.uid},'public');ev('P',c.me.idx,{before:c.me.damage.length+1,after:c.me.damage.length,uids:[ch.uid],heal:true},'public');log(`${c.me.name}：牛乳で${ch.name}Lv${ch.lv}が戻った（ダメージ${c.me.damage.length}）`);if(ch.onTop)await ch.onTop(c.me);},dest:'yo',expire:'now'});
S('朝食のパン','S006','陽',3,3,{text:'【効力持続】このターン、自分のキャラのAT+300。ターン終了時に陽ゲージへ',use:async c=>{c.me.turnMod.at+=300;log(`${c.me.name}：朝食のパン（このターンAT+300）`)},dest:'yo',expire:'endTurn'});
S('病院の待合室にて','S008','陰',1,1,{text:'【行動制限】次の自分のターン開始時まで、両プレイヤーはバトルを行えない。次の自分のターン開始時、相手は1ドローし、このカードは陰ゲージへ',use:async c=>{G.noBattle={by:c.me.idx};log(`${c.me.name}：病院の待合室にて（次の自分のターンまでバトル禁止）`)},dest:'in',expire:'nextTurnStart'});

const CHARS={
 飛鳥:[
  {id:'C001',name:'飛鳥',lv:1,at:400,df:400,text:'（テキストなし）'},
  {id:'C002',name:'飛鳥',lv:2,at:500,df:500,text:'【忍転身】このカードがキャラエリアの一番上になった時、1ドロー',onTop:p=>{draw(p,1);log(`${p.name}：忍転身で1ドロー`)}},
  {id:'C003',name:'飛鳥',lv:3,at:600,df:600,text:'【破れ1】斬撃のバトルカード使用時、そのカードにAT+200',cmod:(p,card)=>card.tech==='斬撃'?{at:200}:null},

 ],
 柳生:[

  {id:'C021',name:'柳生',lv:3,at:500,df:700,text:'【破れ1】射撃・防御のバトルカード使用時AT+200/DF+200',cmod:(p,card)=>['射撃','防御'].includes(card.tech)?{at:200,df:200}:null},

    const key=JSON.stringify([from,to]);if(!groups.has(key))groups.set(key,{from,to,items:[]});groups.get(key).items.push({u,i:b.i});}
  for(const [u,a] of A)if(!B.has(u)){const key=JSON.stringify([{player:a.player,zone:a.zone},null]);if(!groups.has(key))groups.set(key,{from:{player:a.player,zone:a.zone},to:null,items:[]});groups.get(key).items.push({u,i:a.i});}

async function runGame(){
  try{
    let cur=G.first;
    while(true){await turn(cur);cur=1-cur;}
  }catch(e){if(!(e instanceof GameOver)){console.error(e);log('エラー: '+e.message,true);}}
  G.prompt=null;hook('render');hook('gameOver');
}
async function turn(pi){
  const p=P[pi],o=P[1-pi];G.turn++;G.cur=pi;p.flags={};G.bs=null;
  log(`━━ ターン${G.turn}：${p.name}（${p.charName} Lv${p.charDeck[0].lv}）━━`,true);
  G.phase='draw';if(!p.deck.length)resolveLO(p);await hook('turnStart',{turn:G.turn,p:pi}); // 表示用（ターン開始の演出）。ルール・乱数には関与しない

  await withSrc(['rule','draw-phase'],()=>{const n=(G.turn===1)?CONFIG.firstTurnDraw:CONFIG.drawPerTurn;const k=draw(p,n);log(`${p.name}：${k}ドロー（手札${p.hand.length}）`);});

  await withSrc(['rule','turn-end'],async()=>{for(const s of [...p.supports])if(s.expire==='endTurn')await removeSupport(p,s);});

}

async function prep(pi){
  const p=P[pi];
  while(true){
    G.phase='prep';
    const gaugeable=p.hand.filter(c=>c.type==='battle'&&['閃','陽','陰'].includes(c.color));
    const sups=p.hand.filter(c=>c.type==='support'&&gpOK(p,c)&&(!c.canUse||c.canUse(p)));
    const opts=[];
    if(!p.flags.gauge&&gaugeable.length)opts.push({value:'gauge',label:'バトルカードをゲージに置く'});
    if(!p.flags.support&&sups.length)opts.push({value:'support',label:'サポートカードを使う'});
    const cur=p.charDeck[0];
    if(cur.standby&&!p.flags.lv5&&cur.standby.ok(p))opts.push({value:'lv5',label:cur.standby.label});
    opts.push({value:'go',label:battleAllowed(pi)?'バトルへ進む':'ターン終了',primary:true});
    const r=await p.ctl.prepAction(p,opts,{gaugeable,sups});
    if(r.type==='gauge'){OBS_SRC.push(['rule','prep-gauge']);rm(p.hand,r.card);(r.gauge==='yo'?p.gYo:p.gIn).push(r.card);p.flags.gauge=true;log(`${p.name}：「${r.card.name}」を${r.gauge==='yo'?'陽':'陰'}ゲージに置いた（陽${yo(p)}/陰${inn(p)}）`);if(obsOn())flushMoves();OBS_SRC.pop();}
    else if(r.type==='support'){await withSrc(['card',r.card.uid],async()=>{rm(p.hand,r.card);p.flags.support=true;log(`${p.name}：サポート「${r.card.name}」を使用`);const s={card:r.card,dest:r.card.dest,expire:r.card.expire};p.supports.push(s);await r.card.use({me:p,opp:P[1-pi]});if(s.expire==='now')await removeSupport(p,s);});}
    else if(r.type==='lv5'){p.flags.lv5=true;await withSrc(['ability',cur.id],()=>cur.standby.run(p));}
    else if(r.type==='none'){continue;}

    hook('render');
  }
}

  let mode=null,from=null;

    const r=await battle(pi,mode,from);

async function battle(pi,mode,from){
  const p=P[pi],o=P[1-pi];

  hook('stat',{t:'atk',p:pi,turn:G.turn,mode,options:usable.filter(c=>c.dp>0).length,hand:p.hand.length,chosen:!!atkCard});
  if(!atkCard){log(`${p.name}：バトルを行わない`);return{ended:true};}
  OBS_SRC.push(['rule','attack-submit']);rm(p.hand,atkCard);
  const bs={atk:{p,card:atkCard,heavy:[]},def:{p:o,card:null,heavy:[]},chainFrom:from,mode,stage:'def'};G.bs=bs;
  log(`${p.name}：${mode?'【連撃】追加バトル ':''}アタック宣言（カードを裏向きで提出）`);if(obsOn())flushMoves();OBS_SRC.pop();
  hook('render');
  const dUsable=o.hand.filter(c=>canDefend(o,c));
  const reach=dUsable.filter(c=>c.color==='飛'||charDF(o)+c.df>=charAT(p)+atkCard.at).length;
  hook('stat',{t:'def',p:1-pi,turn:G.turn,mode,options:dUsable.length,reach,hand:o.hand.length,atkAT:charAT(p)+atkCard.at});
  const defCard=dUsable.length?await o.ctl.defend(o,dUsable,{attacker:p,mode}):null;
  if(defCard){OBS_SRC.push(['rule','defense-submit']);rm(o.hand,defCard);bs.def.card=defCard;if(obsOn())flushMoves();OBS_SRC.pop();}
  bs.stage='reveal';
  log(`公開：${p.name}「${atkCard.name}」(+${atkCard.at}/+${atkCard.df}) vs ${o.name}${defCard?`「${defCard.name}」(+${defCard.df}DF)`:'：ディフェンスなし'}`,true);
  ev('A',pi,{uid:atkCard.uid,mode:mode||null,chainFrom:from?from.uid:null},'public',['rule','battle']);ev('B',1-pi,{uid:defCard?defCard.uid:null,legal:dUsable.map(c=>c.uid),none:defCard?null:(dUsable.length?(o.ai?'cpu-pass':'human-pass'):'no-legal')},'public',['rule','battle']);
  if(defCard&&o.charDeck[0].onGuard&&defCard.tech==='防御'){const gch=o.charDeck[0];await withSrc(['ability',gch.id],()=>gch.onGuard(o,defCard));}
  // コスト
  for(const [pp,c] of [[p,atkCard],[o,defCard]]){
    if(!c)continue;
    if(c.hiden)await payHiden(pp,c);
    if(c.onReveal&&(c.revealCost||!G.noTextTurn))await withSrc(['card',c.uid],()=>c.onReveal({me:pp,opp:pp===p?o:p,bs}));

  }else if(!defCard&&CONFIG.noDefenseAutoHit){
    computeTotals(bs);success=true;bs.stage='result';
    log(`ディフェンスなし → アタック成功（確定ヒット）`);
  }else{
    computeTotals(bs);
    // 重撃
    bs.stage='heavy';
    let who=0,passes=0,count=0;
    const blocked=i=>{const f=bs.flags;if(f.noHeavyBoth)return true;if(i===1&&(f.noOppHeavy))return true;if(i===0&&f.noAtkHeavy)return true;return false};
    while(passes<2&&count<CONFIG.heavy.maxCards){
      const side=who===0?bs.atk:bs.def;const pl=side.p;
      const elig=blocked(who)?[]:pl.hand.filter(c=>heavyOK(pl,c));
      let add=null;
      if(!elig.length&&!side.noHeavyLogged){side.noHeavyLogged=true;log(`${pl.name}：重撃に使えるカードなし${blocked(who)?'（効果で禁止）':''}`);}
      const hopeless=elig.length&&pl.ai&&CONFIG.aiNoHopelessHeavy&&heavyHopeless(bs,who,elig);
      if(elig.length&&!hopeless){bs.heavyTurn=who;hook('render');add=await pl.ctl.heavy(pl,elig,{at:bs.at,df:bs.df,dp:bs.dp,isAtk:who===0});}
      if(add){OBS_SRC.push(['rule','heavy']);rm(pl.hand,add);side.heavy.push(add);count++;passes=0;computeTotals(bs);log(`${pl.name}：重撃「${add.name}」(+${add.at}/+${add.df}) → AT${bs.at} vs DF${bs.df}`);ev('W',pl.idx,{uid:add.uid,side:who===0?'atk':'def',at:bs.at,df:bs.df},'public');OBS_SRC.pop();}
      else{passes++;if(elig.length)log(`${pl.name}：パス${hopeless?'（重撃札をすべて使っても届かない）':''}`);}
      who=1-who;
    }
    bs.heavyTurn=null;
    success=CONFIG.tieWinner==='attacker'?bs.at>=bs.df:bs.at>bs.df;
    bs.stage='result';
    log(`判定：AT${bs.at}（${bs.atDetail.join('＋')}） vs DF${bs.df}（${bs.dfDetail.join('＋')}） → ${success?'アタック成功':'アタック失敗'}`,true);
  }
  bs.success=success;hook('render');
  ev('J',pi,{at:bs.at,df:bs.df,dp:bs.dp,atDetail:bs.atDetail||null,dfDetail:bs.dfDetail||null,success:!!success,kind:(defCard&&defCard.color==='飛'&&atkCard.color==='飛'&&!G.noTextTurn)?'green-guard':(!defCard&&CONFIG.noDefenseAutoHit)?'no-defense':'compare'},'public',['rule','battle']);
  hook('stat',{t:'res',p:pi,turn:G.turn,mode,success,def:!!defCard,aHeavy:bs.atk.heavy.length,dHeavy:bs.def.heavy.length,at:bs.at,df:bs.df,dp:bs.dp});
  if(success){
    await withSrc(['card',atkCard.uid],()=>applyDamage(o,bs.dp,`「${atkCard.name}」DP${bs.dp}`));
    if(atkCard.onWin&&!bs.atk.null)await withSrc(['card',atkCard.uid],()=>atkCard.onWin(Object.assign({},bs.ctxA)));
    const ch=p.charDeck[0];if(ch.onAtkWin)await withSrc(['ability',ch.id],()=>ch.onAtkWin({me:p,opp:o,bs}));
  }else{
    if(defCard&&!bs.def.null&&defCard.onDefWin)await withSrc(['card',defCard.uid],()=>defCard.onDefWin(Object.assign({},bs.ctxD)));
    if(atkCard.onFail&&!bs.atk.null)await withSrc(['card',atkCard.uid],()=>atkCard.onFail(Object.assign({},bs.ctxA)));
    if(defCard&&o.charDeck[0].onDefWinChar){const dch=o.charDeck[0];await withSrc(['ability',dch.id],()=>dch.onDefWinChar({me:o,opp:p,bs}));}
  }
  if(success&&p.turnMod.winDraw){await withSrc(['rule','futomaki'],()=>{draw(p,1);log(`${p.name}：じっちゃんの太巻きで1ドロー`);});}
  await showResult(bs);
  // 連撃
  let chain=null;
  if(success){
    const icons=[];if(atkCard.icons.includes('R')||bs.grantC||p.charDeck[0].grantR)icons.push('R');
    const avail=icons.filter(ic=>{if(bs.flags.noAtkRenzen||G.noChainTurn)return false;return p.hand.some(c=>canAttack(p,c,ic));});
    if(bs.flags.noAtkRenzen&&icons.length)log('リミットブレイクの効果で連撃は宣言できない');
    if(G.noChainTurn&&icons.length&&!bs.flags.noAtkRenzen&&p.hand.some(c=>canAttack(p,c,'R')))log(`${p.name}：【連撃不可】${G.noChainBy||'相手の効果'}により、このターンは連撃を宣言できない`,true);
    if(avail.length)chain=await p.ctl.chain(p,avail);
    if(chain)log(`${p.name}：【連撃】を宣言（「${atkCard.name}」は捨て札）`,true);
    if(icons.length)ev('K',pi,{declared:!!chain,possible:avail.length>0,from:atkCard.uid},'public',['rule','chain']);
  }
  // カード移動
  OBS_SRC.push(['rule','battle-cleanup']);
  if(chain||bs.oppCardToDiscard){p.discard.push(atkCard);if(bs.oppCardToDiscard)log(`${p.name}：「${atkCard.name}」→捨て札（零雹）`);}
  else await toGaugeByColor(p,atkCard);
  for(const h of bs.atk.heavy){p.discard.push(h);}if(bs.atk.heavy.length)log(`${p.name}：重撃カード${bs.atk.heavy.length}枚→捨て札`);
  if(defCard){if(bs.oppDefToDiscard){o.discard.push(defCard);log(`${o.name}：「${defCard.name}」→捨て札（${p.charDeck[0].name}Lv${p.charDeck[0].lv}）`);}else await toGaugeByColor(o,defCard);}
  for(const h of bs.def.heavy){o.discard.push(h);}if(bs.def.heavy.length)log(`${o.name}：重撃カード${bs.def.heavy.length}枚→捨て札`);

// 被弾でLvが上がる価値（受ける側のキャラの設定）。既定はすべて0

// ゲージ目標：デッキ（30枚の構成）のGP条件。デッキごとに一度だけ数える
const GP_REQ=new Map();

function deckValue(p){const v=useW().deck+(p.deck.length<=P_().deckLowN?P_().deckLowVal:0);return loOn()?v*(1-loNear(p)):v;} // LO評価ありの時は、LOが近いほど薄める（近い分はLO予測で数える）

/* ---------- 新LOの評価（2026-11-05、c_loEval='do' の時だけ使う） ----------
   読むのは公開情報だけ：双方の山札の枚数、双方のダメージエリアの枚数、今どちらのターンか。
   ・LOの時期：自分のドローフェイズ開始時に山札0枚でLO。通常ドローは1ターン2枚とみなす。
     各プレイヤーの次のドローフェイズ開始までの半手番数 next（今が自分のターンなら2、相手のターンなら1）。
     T = next + 2*ceil(山札/2)。T の小さい側が先にLOする（next の偶奇が違うので同時はない）。
   ・勝敗（v1.11既定 loRule='lose'）：LOした側の負け。v = LO側なら −1、相手なら +1。

// クナイ投擲など「防御属性で受けられたら勝敗に関わらずnダメージ」の、攻撃が失敗した時の確定ダメージの価値（攻撃側から見た値）。
// 実装（onFail）は攻撃失敗時だけ。インテリメガネのターンはバトルカードのテキストが無効なので0
function guardHitValue(D,atkCard,defCard){if(!defCard||defCard.tech!=='防御'||E.G.noTextTurn)return 0;const n=loFx(atkCard).guardHitDmg;return n?dmgValue(D,n):0;}
function loOn(){return P_().c_loEval==='do';}
// 今の局面でLOがどれだけ近いか（0＝評価の範囲外〜1＝直前）。既存の山札まわりの評価を薄める割合に使う
function loNear(p){const s=loSnap(p);const Q=P_();const H=Q.n_loHorizon==null?6:Q.n_loHorizon;const tm=(s.myTurn?2:1)+2*Math.ceil(Math.max(0,s.md)/2),to=(s.myTurn?1:2)+2*Math.ceil(Math.max(0,s.od)/2);return Math.max(0,1-Math.min(tm,to)/(H+1));}
// 任意ドローの手札の増分だけ（counterDrawValue から山札の残りの項を除いたもの）
function loDrawHandGain(p,n){const h=p.hand.length-1;const gain=h>=7?35:h>=5?90:220;return n*gain-110;}
function loSnap(p){const o=E.P[1-p.idx];return{md:p.deck.length,od:o.deck.length,mg:p.damage.length,og:o.damage.length,myTurn:E.G.cur===p.idx};}
function loValue(s){const Q=P_();const H=Q.n_loHorizon==null?6:Q.n_loHorizon;
  const tm=(s.myTurn?2:1)+2*Math.ceil(Math.max(0,s.md)/2),to=(s.myTurn?1:2)+2*Math.ceil(Math.max(0,s.od)/2);

// 局面 s の自分側・相手側を入れ替える（評価の視点を変える）
function loFlip(s){return{md:s.od,od:s.md,mg:s.og,og:s.mg,myTurn:!s.myTurn};}
// カード・キャラのテキストから、山札の枚数が変わる効果を読む（カードのデータは変えない。表は単体テストで固定）
const LO_FX=new Map();
function loFx(c){if(!c)return null;const key=c.id+'|'+c.name;let f=LO_FX.get(key);if(f)return f;const t=c.text||'';let m;f={};
  if((m=t.match(/アタックして勝利したとき、相手は山札の上から(\d)枚を捨て札/)))f.winMill=+m[1];
  if((m=t.match(/相手がディフェンスでバトルカードを出さなかった時、相手は山札の上から(\d)枚を捨て札/)))f.noDefMill=+m[1];
  if((m=t.match(/アタックして勝利したとき、(\d)ドロー/)))f.winDraw=+m[1];
  if((m=t.match(/相手が防御属性のバトルカードでディフェンスした時、勝敗に関わらず(\d)ダメージ/)))f.guardHitDmg=+m[1]; // クナイ投擲（実装は攻撃失敗時の onFail）
  if((m=t.match(/アタック側でバトルに勝利するたび、相手の山札の上から(\d)枚/)))f.charWinMill=+m[1];
  if((m=t.match(/アタック側でバトルに勝利するたび、両プレイヤーがそれぞれ(\d)枚引く/)))f.charBothDraw=+m[1];
  if((m=t.match(/防御属性のバトルカードでディフェンスするたび、(\d)枚引く/)))f.guardDraw=+m[1];
  if(/ディフェンス側でバトルに勝利するたび、自分の捨て札から.*山札の一番下に戻/.test(t))f.defWinReturn=1;
  if(/^登場時/.test(t)&&!/同数引く/.test(t)&&!/てよい/.test(t)){const d=t.match(/(\d)枚引/),b=t.match(/手札(\d)枚[^。]*山札の一番下に戻/);if(d){f.topDrawN=+d[1];f.topBackN=b?+b[1]:0;f.topDraw=f.topDrawN-f.topBackN;}} // topDraw は山札が足りる時の実質の減り（表示・テスト用）。予測は loTopDraw で枚数を見て計算
  LO_FX.set(key,f);return f;}
// 被弾 n 回で新しく一番上になるキャラの「登場時」の必須ドローによる山札の減り
// 被弾 n 回で新しく一番上になるキャラの「登場時」の必須ドローによる山札の減り（負なら増え）。deck＝その時点の山札枚数（既定は今の枚数）。
// ドローは山札が足りる分だけ（engine の draw と同じ）。戻す枚数はそのまま（柳生Lv2：山札0なら引けず1枚戻るので +1）
function loTopDraw(t,n,deck,hand){if(deck==null)deck=t.deck.length;if(hand==null)hand=t.hand.length;let d=deck,h=hand;for(let i=1;i<=n&&i<t.charDeck.length;i++){const f=loFx(t.charDeck[i]);if(f.topDrawN){const k=Math.min(f.topDrawN,Math.max(0,d));d-=k;h+=k;const b=Math.min(f.topBackN||0,h);d+=b;h-=b;}}return deck-d;} // 戻すのは手札にある分だけ（手札も山札も空なら戻らない）
// n 枚引く時の実際の減り（山札が足りる分だけ）
function loDrawN(deck,n){return Math.min(n,Math.max(0,deck));}
// 1バトルの結果による LO 価値の変化（攻撃側 A から見た値）。success/dp は重撃込みの結果
function loBattleDelta(A,D,atkCard,defCard,success,dp,paid){ // paid: 重撃の先読み中。バトル開始時の山札コストと防御時のドローは解決済み
  if(success&&D.damage.length+dp>=CONFIG.winDamage)return 0; // 5ダメージ決着が優先
  const s0=loSnap(A);const s={...s0};const txt=!E.G.noTextTurn; // インテリメガネのターンはバトルカードのテキストが無効（コストは残る）
  let costMilled=0;if(!paid){s.md-=loDrawN(s.md,atkCard.costMill||0);if(defCard){costMilled=loDrawN(s.od,defCard.costMill||0);s.od-=costMilled;}} // 山札が足りない時は削れる分だけ。paid（重撃の先読み中）の時はコストで捨てた札はすでに捨て札にある
  const fa=txt?loFx(atkCard):{},fA=loFx(A.charDeck[0]),fD=loFx(D.charDeck[0]);
  if(!paid&&defCard&&defCard.tech==='防御'&&fD.guardDraw)s.od-=fD.guardDraw; // 雲雀Lv4の防御ドローは防御札を出した時点で解決済み（重撃の先読み中は数えない）
  let alt=null;
  if(success){s.og+=dp;s.od-=loTopDraw(D,dp,s.od);
    s.od-=Math.min(s.od,(fa.winMill||0)+(!defCard?(fa.noDefMill||0):0)+(fA.charWinMill||0));
    s.md-=loDrawN(s.md,(fa.winDraw||0)+(A.turnMod&&A.turnMod.winDraw?1:0)+(fA.charBothDraw||0));s.od-=loDrawN(s.od,fA.charBothDraw||0);
  }else{
    if(defCard&&defCard.tech==='防御'&&fa.guardHitDmg){const n=fa.guardHitDmg;if(D.damage.length+n>=CONFIG.winDamage)return 0; // 5ダメージ決着が優先
      s.og+=n;s.od-=loTopDraw(D,n,s.od);} // クナイ投擲：防御属性で受けられて攻撃が失敗しても確定ダメージ
    if(defCard&&fD.defWinReturn&&(D.discard.length+costMilled)>0){ // 捨て札はコストで捨てた分も含む。戻すかは防御側の判断を写す：防御側がLO評価ありなら有利な方、なしなら常に戻す（pickCardsFallback の既定）

  return after-loValue(s0);}
// 自分の局面だけが変わる効果（サポート・任意ドローなど）の LO 価値の変化
function loSelfDelta(p,dDeck,dDmg,dOppDeck){const s0=loSnap(p);const s={...s0,md:Math.max(0,s0.md+dDeck),mg:Math.max(0,s0.mg+(dDmg||0)),od:Math.max(0,s0.od+(dOppDeck||0))};return loValue(s)-loValue(s0);}

// 1バトルをロールアウトして、攻撃側から見た利得を返す（状態は変更しない）
function evalBattle(A,D,atkCard,defCard,mode,decider=null){
  // decider: 判断している側の席。その側のプロファイルが標準以外なら、ロールアウトでは両者が各自のプロファイルで重撃を出す（PR #1 と同じ扱い）
  const dprof=decider===null?CPU_PROFILE_DEFAULT:profOf(decider===A.idx?A:D);const modelProf=dprof!==CPU_PROFILE_DEFAULT;
  // A,D は仮想プレイヤー（hand差し替え済み）。atkCard は A.hand の要素、defCard は D.hand の要素か null
  const aHand=A.hand.filter(c=>c!==atkCard), dHand=defCard?D.hand.filter(c=>c!==defCard):D.hand.slice();
  const a=vplayer(A,aHand), d=vplayer(D,dHand);
  let pay=0;
  // コスト
  { // コスト（攻撃札→防御札の順）
    const c=atkCard;if(c.hiden)pay+=-1*3*useW().gauge;if(c.costMill)pay+=-1*c.costMill*deckValue(a);if(c.costHand)pay+=-1*c.costHand*useW().hand;
    const e=defCard;if(e){if(e.hiden)pay+=1*3*useW().gauge;if(e.costMill)pay+=1*e.costMill*deckValue(d);if(e.costHand)pay+=1*e.costHand*useW().hand;}
  }
  let success,dp=atkCard.dp,aHeavy=[],dHeavy=[];
  if(defCard&&defCard.color==='飛'&&atkCard.color==='飛'&&!E.G.noTextTurn){success=false;}
  else if(!defCard){success=true;}
  else{
    const bs={atk:{p:a,card:atkCard,heavy:aHeavy},def:{p:d,card:defCard,heavy:dHeavy},chainFrom:null,mode,lite:true};
    computeTotals(bs);
    const hpBase=useHP();const hpA=Object.assign({},hpBase,{profile:modelProf?profOf(a):CPU_PROFILE_DEFAULT}),hpD=Object.assign({},hpBase,{profile:modelProf?profOf(d):CPU_PROFILE_DEFAULT});
    let who=0,passes=0,count=0;const hctx={at:0,df:0,dp:0,isAtk:true}; // heavyPolicy に渡す局面（使い回す）
    const blocked=i=>{const f=bs.flags;if(f.noHeavyBoth)return true;if(i===1&&f.noOppHeavy)return true;if(i===0&&f.noAtkHeavy)return true;return false};
    while(passes<2&&count<CONFIG.heavy.maxCards){
      const side=who===0?bs.atk:bs.def;const pl=side.p;const opp=who===0?d:a;
      const losingSide=who===0?bs.at<bs.df:bs.df<=bs.at; // heavyPolicy は負けている側しか出さないので、それ以外は候補を作らない
      const elig=(!losingSide||bs.dp<=0||blocked(who))?[]:pl.hand.filter(c=>heavyOK(pl,c));
      let add=null;if(elig.length){hctx.at=bs.at;hctx.df=bs.df;hctx.dp=bs.dp;hctx.isAtk=who===0;add=heavyPolicy(pl,opp,elig,hctx,side.heavy.length,who===0?hpA:hpD);}
      if(add){pl.hand=pl.hand.filter(c=>c!==add);side.heavy.push(add);count++;passes=0;computeTotals(bs);}
      else passes++;
      who=1-who;
    }
    success=CONFIG.tieWinner==='attacker'?bs.at>=bs.df:bs.at>bs.df;dp=bs.dp;
  }
  // カードの収支
  pay-=useW().hand;                                          // 攻撃札は手札から出る
  pay-=aHeavy.length*useW().hand;
  pay+=dHeavy.length*useW().hand;
  if(defCard){pay+=useW().hand;if(defCard.color!=='飛'&&defCard.color!=='秘')pay-=gaugeValue(D,defCard);}
  if(success){
    pay+=dmgValue(D,dp);
    if(atkCard.onWin){ if(atkCard.hiden)pay+=useW().hand; // 1ハンデス
      else{const fx=loFx(atkCard);const isMill=!!(fx.winMill||fx.noDefMill);const w=isMill?P_().w_onWinMill:0.8; // 削り札の勝利時効果の価値（手札1枚分の倍率、既定0.8＝従来）。LO評価ありならLOが近いほど薄め、近い分はLO予測で数える
        pay+=useW().hand*w*(isMill&&loOn()?(1-loNear(A)):1);}}
    // 連撃の見込み
    const chainable=atkCard.icons.includes('R')||A.charDeck[0].grantR;
    if(chainable&&a.hand.some(c=>canAttack(a,c,'R'))){

  }else{
    if(atkCard.color!=='飛'&&atkCard.color!=='秘')pay+=gaugeValue(A,atkCard);

    pay+=guardHitValue(D,atkCard,defCard); // クナイ投擲：防御属性で受けられて失敗しても確定ダメージ（2026-11-05、常に評価）
  }
  if(dprof.holdGuard&&decider===A.idx&&!(success&&D.damage.length+dp>=CONFIG.winDamage)){
    // この攻撃（重撃込み）で、次の相手の攻撃を守れる割合がどれだけ下がるか
    const thr=threatList(D);

  }
  if(modelProf&&decider===A.idx){const P_=dprof;
    const lethal=success&&D.damage.length+dp>=CONFIG.winDamage;
    if(!lethal){
      // 決着しない攻撃に防御札・重撃札を使うと、次の手番の資源が減る
      const reserve=c=>c.icons.includes('U')?P_.atkReserveHeavy:0;

  if(decider===D.idx&&isGuard(defCard)){ // 選択：防御札でディフェンス
    const m=dprof.c_guardDefend,w=dprof.w_guardDefend||0;
    if(m==='cond'){if(D.charDeck[0].lv<dprof.n_guardDefend)pay+=w;} // 条件（Lv）を満たさない時は減点（既定：Lv3以下は温存）

    if(modelProf)pay-=dprof.defGuardWin; // 防御成功で次の手番の資源が残る
  }

  return pay;
}

// 利得表から混合戦略（後悔最小化）
function solveMatrix(M){ // M[i][j] 行プレイヤーの利得。列プレイヤーはその負
  const n=M.length,m=M[0].length;
  const rR=new Array(n).fill(0),rC=new Array(m).fill(0),sR=new Array(n).fill(0),sC=new Array(m).fill(0);
  const strat=(r)=>{const pos=r.map(x=>Math.max(0,x));const s=pos.reduce((a,b)=>a+b,0);return s>0?pos.map(x=>x/s):r.map(()=>1/r.length);};
  for(let t=0;t<useS().iters;t++){
    const pr=strat(rR),pc=strat(rC);
    for(let i=0;i<n;i++)sR[i]+=pr[i];for(let j=0;j<m;j++)sC[j]+=pc[j];
    const uR=M.map(row=>row.reduce((a,v,j)=>a+v*pc[j],0));
    const uC=new Array(m).fill(0);for(let j=0;j<m;j++)for(let i=0;i<n;i++)uC[j]+=-M[i][j]*pr[i];

// 攻撃側の判断：行＝自分の攻撃札（＋攻撃しない）、列＝相手の防御札（名前）＋なし
function solveAttack(p,o,usable,mode){
  const decider=p.idx;
  const rows=usable.slice();const allowNone=!mode;
  const colNames=new Map();  // name -> index
  const samples=[];
  for(let s=0;s<useS().samples;s++){
    const oh=sampleHand(o);const d=vplayer(o,oh);
    const defs=oh.filter(c=>canDefend(d,c));
    const names=[...new Set(defs.map(c=>c.name))];
    for(const nm of names)if(!colNames.has(nm))colNames.set(nm,colNames.size);
    samples.push({d,defs,names});
  }
  const cols=[...colNames.keys()];cols.push('__none');
  const M=rows.map(()=>new Array(cols.length).fill(0));
  const cnt=rows.map(()=>new Array(cols.length).fill(0));
  for(const smp of samples){
    const a=vplayer(p,p.hand);
    rows.forEach((atk,i)=>{
      const vNone=evalBattle(a,smp.d,atk,null,mode,decider);
      cols.forEach((nm,j)=>{
        let v;
        if(nm==='__none')v=vNone;
        else{const dc=smp.defs.find(c=>c.name===nm);v=dc?evalBattle(a,smp.d,atk,dc,mode,decider):vNone;}
        M[i][j]+=v;cnt[i][j]++;

    });
  }
  for(let i=0;i<rows.length;i++)for(let j=0;j<cols.length;j++)M[i][j]/=cnt[i][j]||1;
  if(allowNone){ // 選択：アタックを見送る

    if(ok){let pv=c.m==='do'?c.w:c.m==='avoid'?-c.w:0;if(loOn()&&P_().w_loPass){const L=loValue(loSnap(p));const lw=(P_().w_loEval||0)*useW().lethal;if(lw)pv+=P_().w_loPass*useW().hand*L/lw;} // 新LO：LOで勝てる見込み（−1〜1）に応じて見送りを足す
      M.push(new Array(cols.length).fill(pv));rows.push(null);}

  const sol=solveMatrix(M);

}
// 防御側の判断：行＝自分の防御札（＋なし）、列＝相手の攻撃札（名前）
function solveDefend(p,o,usable,mode){
  const decider=p.idx;
  const rows=usable.slice();rows.push(null);
  const colNames=new Map();const samples=[];
  const bs=E.G&&E.G.bs;
  const hidden=(cur&&cur.sampleFix&&bs&&bs.stage==='def'&&bs.atk.p.idx===o.idx)?bs.atk.card:null;
  for(let s=0;s<useS().samples;s++){
    const oh=sampleHand(o,hidden);const a=vplayer(o,oh);
    const atks=oh.filter(c=>canAttack(a,c,mode)&&c.dp>0);
    const names=[...new Set(atks.map(c=>c.name))];
    for(const nm of names)if(!colNames.has(nm))colNames.set(nm,colNames.size);
    samples.push({a,atks});
  }
  const cols=[...colNames.keys()];
  if(!cols.length)return {choice:null,probs:null,rows};
  const M=rows.map(()=>new Array(cols.length).fill(0));const cnt=rows.map(()=>new Array(cols.length).fill(0));
  for(const smp of samples){
    const d=vplayer(p,p.hand);
    cols.forEach((nm,j)=>{
      const ac=smp.atks.find(c=>c.name===nm);if(!ac)return;
      rows.forEach((def,i)=>{M[i][j]+=-evalBattle(smp.a,d,ac,def,mode,decider);cnt[i][j]++;});
    });
  }
  for(let i=0;i<rows.length;i++)for(let j=0;j<cols.length;j++){if(cnt[i][j])M[i][j]/=cnt[i][j];else M[i][j]=M[rows.length-1][j]||0;}

    const c=CH('noDefense');const last=rows.length-1;const anyLethal=p.damage.length+1>=CONFIG.winDamage;
    const drop=rows.length>1&&(c.m==='never'||(c.m==='cond'&&!(p.charDeck[0].lv<=c.n&&!anyLethal)));

<script>

   - 乱数: mulberry32(seed)

       p  = プレイヤー番号 0/1
       op = P 準備フェイズ (g<uid>y|i=ゲージ置き, s<uid>=サポート, l=スタンバイ能力, n=やめる, b=バトルへ/終了)

            H 重撃札 <uid> / - (パス)

const UI_VER='演出v2.1';

const METHODS=Object.keys(CODE);

function animatePowers(){
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('[data-power]').forEach(el=>{
   const from=Number(el.dataset.from),to=Number(el.dataset.to);
   if(from===to||reduced)return;
   // 右端の一の位から順番に桁を回す。各桁は必ず最終的な数字で止まる。
   const direction=to>from?1:-1;
   const a=String(Math.abs(Math.trunc(from))),b=String(Math.abs(Math.trunc(to)));
   const digits=Math.max(a.length,b.length);
   const before=a.padStart(digits,'0'),after=b.padStart(digits,'0');
   el.textContent='';el.setAttribute('aria-label',String(to));
   for(let i=0;i<digits;i++){
     const fromDigit=Number(before[i]),toDigit=Number(after[i]);
     const place=digits-1-i;
     const windowEl=document.createElement('span');windowEl.className='od-digit';windowEl.setAttribute('aria-hidden','true');
     const strip=document.createElement('span');strip.className='od-strip';
     // 0～9を複数周並べて、繰り上がり・繰り下がりを自然に見せる。
     for(let n=0;n<40;n++){const cell=document.createElement('span');cell.className='od-cell';cell.textContent=String(n%10);strip.appendChild(cell);}
     windowEl.appendChild(strip);el.appendChild(windowEl);
     const startIndex=20+fromDigit;
     let steps=direction>0?(toDigit-fromDigit+10)%10:(fromDigit-toDigit+10)%10;
     // 上位の桁も変化したときは下位の桁を一周させる。
     if(steps===0&&place===0)steps=10;

         {transform:`translateY(${-endIndex*height}em)`}

   }
 });
}

function showRules(){openOv(`<h2>採用ルール v2（閃乱カグラ版＋リメイク決定事項）</h2><div class="detail"><p><b>${Replay.LOG_VERSION}</b>：緑の巻物は案1、固定デッキ・AIはv1.11サイクル14の設定。キャラ能力は全員NEW版に統一。登場時・勝利時・スタンバイ能力の詳細はキャラカードを確認してください。牛乳による再登場でも登場時能力が発動します。</p>
<p><b>勝利</b>：5ダメージを受けたプレイヤーは即敗北。自分のドローフェイズ開始時に山札0枚ならLOとなり、そのプレイヤーは即敗北。LO判定は病院解除などの開始時効果より先。ドローフェイズ以外の山札0枚ではLOしません。</p>
<p><b>準備</b>：キャラデッキLv1〜5（5枚）＋固定山札30枚。初期手札4枚、マリガンなし。先攻1ターン目は1ドローで、バトルも行えます。以後毎ターン2ドロー。</p>
<p><b>ダメージ</b>：Lv1〜4の被弾では先頭のキャラカードがダメージエリアへ移り、次のレベルが登場。最後のキャラで被弾した場合は5ダメージで即敗北。ダメージ処理で山札は消費せず、山札不足による第三の敗北条件はありません。</p>
<p><b>準備フェイズ</b>：バトルカード1枚をゲージへ（1回）、サポート1枚（1回）、Lv5の合図など。</p>
<p><b>バトル</b>：攻守が裏向きで同時に出して公開。AT≧DFで攻撃成功（同値は攻撃側）。ディフェンスを出さなければ確定ヒット。</p>
<p><b>重撃</b>：1枚目は何でもよく、2枚目以降は重撃アイコン必須。GP条件は無視、枚数無制限。攻撃側から交互に追加し、両者が続けてパスで終了。2枚目以降は＋AT/＋DFのみ有効、バトル後は捨て札。</p>
<p><b>連撃（v2）</b>：連撃アイコンを持つ技で攻撃成功後、手札の緑カードで追加攻撃できる（元のカードは捨て札）。追加攻撃に使えるのは緑のみ。緑にも連撃があれば続けられる。緑の攻撃時使用条件は「忍ゲージに指定カード」。</p>
<p><b>緑による防御（v2）</b>：緑は条件なしでディフェンスに出せる。相手の攻撃札が緑なら無条件で防御成功（連撃はそこで終了）。吹飛の無効化は緑には効かない。通常の攻撃に対して緑を出してもDF+0。</p>
<p><b>秘伝忍法（紫）</b>：陽4/陰4に加え、忍ゲージから閃・陽・陰を1枚ずつ捨てる。DP2。勝利時のハンデスは1枚（v2）。</p>
<p><b>山札</b>：標準30枚（v2）。40枚（原作）も選択可。</p>
<p><b>カードの移動</b>：陽→陽ゲージ、陰→陰ゲージ、閃→どちらか選択、緑・紫→捨て札。GPは消費されない閾値。</p>
<p class="small">※テキストに「推定」とあるカードは、原文を判読できず数値や条件を補っています。カードをタップすると詳細を確認できます。</p>
</div>`);}

function newGame(mode,d1,d2,first,delay,cpu='solver',resume=null,undo=0){
  CONFIG.deckSize=30;
  const seed=resume?resume.seed:Math.floor(Math.random()*2147483647);
  const rng=Replay.mulberry32(seed);
  if(resume&&resume.rngFirst==='random')first='random';
  const rngFirst=(first==='random'||first==null)?'random':'fixed';
  if(rngFirst==='fixed')first=+first;
  // 座席ごとのコントローラ: H=人間, S=ソルバー, A=経験則AI
  const codes=resume?resume.ctl:[mode==='watch'?(cpu==='solver'?'S':'A'):'H',(mode==='watch'||mode==='cpu')?(cpu==='solver'?'S':'A'):'H'];
  const base=c=>c==='H'?Human:c==='S'?Solver.makeSolver({sampleFix:true,profiles:FINAL_PROFILES}):AI; // 汎用AI（係数表。雲雀だけ専用の値）＋防御側サンプリング修正
  const label=c=>c==='H'?'人間':c==='S'?'CPU(ソルバー)':'CPU(経験則AI)';
  const ai=codes.map(c=>c!=='H');
  REC={ops:[],marks:[]};UI.delay=delay;
  const rstate=resume?{ops:resume.ops,i:0,live:false}:null;
  // CPUの席は再生中もCPUに同じ問いを投げて乱数を進める（再開・戻るの後もCPUが同じ手を返す）
  const ctls=codes.map((c,i)=>{let ctl=base(c);if(rstate)ctl=Replay.makeReplayer(ctl,rstate,i,()=>{G.replaying=false;G.delay=UI.delay;render();},c!=='H');return Replay.makeRecorder(ctl,REC,i);});
  setupGame({mode,decks:[d1,d2],ai,ctls,ctlLabels:codes.map(label),first,delay,spectate:mode==='watch',rng,
    hooks:{render:()=>{if(!G.replaying)render();},
      turnStart:async({p})=>{REC.marks.push({turn:G.turn,p,i:REC.ops.length});if(G.replaying)return;render();const mine=p===bottomIdx();await showBanner('turn',G.mode==='cpu'?(mine?'あなたのターン':'相手のターン'):`${P[p].name}のターン`,`ターン${G.turn}　${P[p].charName} Lv${P[p].charDeck[0].lv}`);},
      phase:async ph=>{if(G.replaying)return;render();if(ph==='battle')await showBanner('phase','バトルフェイズ');},gameOver:()=>{G.replaying=false;render();showGameOver();autoCopy('決着');},turnEnd:()=>autoCopy(`T${G.turn}終了`),
      showResult:async bs=>{if(G.replaying)return;const humans=P.filter(x=>!x.ai);if(!humans.length){await sleep(G.delay*2);return;}const viewer=G.mode==='hotseat'?G.viewer:humans[0].idx;await uiPrompt(viewer,{title:`${bs.success?'アタック成功':'アタック失敗'}：AT${bs.at} vs DF${bs.df}${(bs.success&&G.noChainTurn&&bs.atk.p===P[G.cur])?`　※${G.noChainBy||'相手の効果'}により、このターンは連撃できません`:''}`,buttons:[{value:'ok',label:'次へ',primary:true}]},false);}}});
  G.meta={seed,decks:[d1,d2],first:G.first,rngFirst,ctl:codes,cards:P.map(Replay.cardMap),undo};
  G.replaying=!!(rstate&&rstate.ops.length);if(G.replaying)G.delay=0;
  if(resume)log(undo?`（戻る：操作${resume.ops.length}件まで再生。戻る${undo}回目）`:`（ログから再開：操作${resume.ops.length}件を再生）`,true);
  if(mode==='hotseat')G.viewer=G.first;
  render();runGame();
}

let gaugePickView=null;
function syncGaugePickView(prompt){

  }

  const {owner,cards,n,heading}=prompt.spec.gaugePick;
  const candidates=new Map(cards.map(card=>[card.uid,card]));
  const allCards=new Map([...owner.gYo,...owner.gIn].map(card=>[card.uid,card]));

    <div class="hiden-cost-entry">
      <button type="button" class="hiden-cost-card" data-cost-uid="${card.uid}" aria-pressed="false"${candidates.has(card.uid)?'':' disabled'}>${cardHTML(card)}</button>

  </header>

  </div>
  <div class="hiden-cost-scroll" data-cost-detail hidden></div>
  <footer>
    <button type="button" class="primary" data-cost-confirm disabled>選択確定</button>
    <button type="button" data-cost-back hidden>選択画面に戻る</button>
  </footer>`;
  const list=dialog.querySelector('[data-cost-list]');
  const detail=dialog.querySelector('[data-cost-detail]');
  const confirm=dialog.querySelector('[data-cost-confirm]');
  const back=dialog.querySelector('[data-cost-back]');
  let infoButton;
  function update(){
    dialog.querySelector('[data-cost-count]').textContent=`選択 ${selected.size} / 必要 ${n} 枚`;
    confirm.disabled=selected.size!==n;
    for(const button of dialog.querySelectorAll('[data-cost-uid]')){
      const uid=Number(button.dataset.costUid);
      const chosen=selected.has(uid);
      button.setAttribute('aria-pressed',String(chosen));
      button.disabled=!candidates.has(uid)||(!chosen&&selected.size===n);
    }
  }
  dialog.addEventListener('cancel',event=>event.preventDefault());
  dialog.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button||button.disabled||G.prompt!==prompt)return;
    if(button===back){
      detail.hidden=true;
      detail.innerHTML='';
      list.hidden=false;
      back.hidden=true;
      confirm.hidden=false;
      infoButton.focus();
      return;
    }
    if(!detail.hidden)return;
    if(button===confirm){
      if(selected.size!==n)return;
      const chosen=Array.from(selected,uid=>candidates.get(uid));
      if(chosen.some(card=>!card||(!owner.gYo.includes(card)&&!owner.gIn.includes(card)))){
        console.error('忍ゲージ選択が無効', {turn:G.turn,title:prompt.spec.title,selected:[...selected]});
        return;
      }
      resolvePrompt({cards:chosen});
      syncGaugePickView(null);
      return;
    }
    if(button.dataset.infoUid){
      const card=allCards.get(Number(button.dataset.infoUid));
      if(!card)return;
      infoButton=button;
      list.hidden=true;
      confirm.hidden=true;
      detail.innerHTML=cardDetailHTML(card);
      detail.hidden=false;
      back.hidden=false;
      back.focus();
      return;
    }
    const uid=Number(button.dataset.costUid);
    if(!candidates.has(uid))return;
    if(selected.has(uid))selected.delete(uid);
    else if(selected.size<n)selected.add(uid);

  });

  document.body.appendChild(dialog);
  update();
  dialog.showModal();

}

}

<script>

'use strict';
// v1.8 新UI 第2段階（2026-11-06）：札の使用・移動とキャラ能力の演出。ゲームの進行（エンジン・乱数・再現ログ）は変えない
// 仕組み：G.log に積まれる行から演出を作って順に再生する。次の判断（人間・CPUとも）の前に、演出が終わるのを待つ
(function(){
const FX={q:[],busy:false,waiters:[]};window.FX=FX;
const base=()=>{if(!G||G.replaying||SETTINGS.anim==='off')return 0;return SETTINGS.anim==='short'?150:300;}; // 1演出0.3秒（短め設定は半分）
let layer=null;function L(){if(!layer){layer=document.createElement('div');layer.id='fx';document.body.appendChild(layer);}return layer;}
const pOf=s=>P.find(p=>s.startsWith(p.name+'：'));
const rectOf=sel=>{const e=document.querySelector(sel);return e?e.getBoundingClientRect():null;};
const centerRect=()=>rectOf('#app .nv-center')||{left:innerWidth/2-60,top:innerHeight/2-80,width:120,height:160};
function zoneRect(p,z){if(!p)return null;
  if(z==='yo'||z==='in')return rectOf(`#app .nv-g.${z}[data-p="${p.idx}"] .col`);
  if(z==='hand')return p.idx===bottomIdx()?rectOf('#nvhand'):rectOf('#app .nv-backs');
  return rectOf(`#app .nv-info [data-zone="${z}"][data-p="${p.idx}"]`);}
function cardEl(name,big){const t=CARDS[name];const d=document.createElement('div');d.className='fx-card';
  d.innerHTML=t?cardHTML(t,{text:big}):`<div class="card"><div class="nm">${name}</div></div>`;return d;}
function place(el,cx,cy){el.style.left=cx+'px';el.style.top=cy+'px';}
const anim=(el,kf,ms)=>new Promise(r=>{if(!ms||typeof el.animate!=='function'){r();return;}const a=el.animate(kf,{duration:ms,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});a.onfinish=r;a.oncancel=r;});
// 演出の種類
async function showCenter(names,label,ms){ // 中央に札を出す（使用・公開・重撃）
  const c=centerRect();const box=document.createElement('div');box.className='fx-center';place(box,c.left+c.width/2,c.top+c.height/2);
  box.innerHTML=(label?`<div class="fx-label">${label}</div>`:'')+'<div class="fx-row"></div>';const row=box.querySelector('.fx-row');
  for(const n of names){if(n)row.appendChild(cardEl(n,true));else{const w=document.createElement('div');w.className='fx-none';w.textContent='ディフェンスなし';row.appendChild(w);}}
  L().appendChild(box);await anim(box,[{opacity:0,transform:'translate(-50%,-50%) scale(.6)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],ms*0.4);
  await new Promise(r=>setTimeout(r,ms*0.6));await anim(box,[{opacity:1},{opacity:0}],ms*0.3);box.remove();}
async function fly(name,from,to,ms){ // 札が置き場へ動く
  if(!to)return;const f=from||centerRect();const el=cardEl(name,false);el.classList.add('fx-fly');L().appendChild(el);
  const fx=f.left+f.width/2,fy=f.top+f.height/2,tx=to.left+to.width/2,ty=to.top+to.height/2;place(el,fx,fy);
  await anim(el,[{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${tx-fx}px),calc(-50% + ${ty-fy}px)) scale(.35)`,opacity:.3}],ms);el.remove();}
async function ability(p,text,ms){ // キャラ能力：キャラを中央に出し、効果を添える
  const c=centerRect();const ch=p.charDeck[0];const box=document.createElement('div');box.className='fx-center fx-ability';place(box,c.left+c.width/2,c.top+c.height/2);
  box.innerHTML=`<div class="fx-label">${p.charName}${ch?' Lv'+ch.lv:''}</div><div class="fx-abtext">${text}</div>`;L().appendChild(box);
  await anim(box,[{opacity:0,transform:'translate(-50%,-50%) scale(.7)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],ms*0.3);
  await new Promise(r=>setTimeout(r,ms*0.7));await anim(box,[{opacity:1},{opacity:0}],ms*0.3);box.remove();}
async function pop(target,text,cls,ms){ // 数字の横に小さく出す（常在効果・ダメージ）
  if(!target)return;const el=document.createElement('div');el.className='fx-pop '+(cls||'');el.textContent=text;place(el,target.left+target.width/2,target.top);L().appendChild(el);
  await anim(el,[{opacity:0,transform:'translate(-50%,0)'},{opacity:1,transform:'translate(-50%,-18px)'},{opacity:0,transform:'translate(-50%,-30px)'}],ms);el.remove();}
// G.log の行 → 演出
function fromLog(s){
  const ms=base();if(!ms||!P.length)return;const p=pOf(s);let m;
  if((m=s.match(/^公開：(.+?)「(.+?)」.*? vs (.+?)(?:「(.+?)」|：ディフェンスなし)/)))return push(()=>showCenter([m[2],m[4]||null],'オープン',ms*2));
  if(p&&(m=s.match(/：重撃「(.+?)」/)))return push(()=>showCenter([m[1]],`${p.name}：重撃`,ms));
  if(p&&(m=s.match(/：サポート「(.+?)」を使用/)))return push(()=>showCenter([m[1]],`${p.name}：サポート`,ms*2));
  if(p&&(m=s.match(/：「(.+?)」を(陽|陰)ゲージに置いた/))){const z=m[2]==='陽'?'yo':'in';return push(()=>fly(m[1],zoneRect(p,'hand'),zoneRect(p,z),ms));}
  if(p&&(m=s.match(/：「(.+?)」→(陽|陰)ゲージ/))){const z=m[2]==='陽'?'yo':'in';return push(()=>fly(m[1],null,zoneRect(p,z),ms));}
  if(p&&(m=s.match(/：「(.+?)」→捨て札/)))return push(()=>fly(m[1],null,zoneRect(p,'discard'),ms));
  if(p&&(m=s.match(/：重撃カード(\d+)枚→捨て札/)))return push(()=>fly('重撃',null,zoneRect(p,'discard'),ms));
  if((m=s.match(/^(.+?)：「(.+?)」DP\d+で/))){const q=P.find(x=>x.name===m[1]);if(q)return push(()=>pop(zoneRect(q,'damage'),'ダメージ','dmg',ms*2));}
  if((m=s.match(/^判定：AT\d+（(.+?)） vs DF\d+（(.+?)）/))){const a=m[1].match(/効果\+(\d+)/),d=m[2].match(/効果\+(\d+)/);const bs=G.bs;
    if(a&&bs)push(()=>pop(rectOf(`#app [data-pw="${bs.atk.p.idx}"]`),`効果 +${a[1]}`,'eff',ms*2));
    if(d&&bs)push(()=>pop(rectOf(`#app [data-pw="${bs.def.p.idx}"]`),`効果 +${d[1]}`,'eff',ms*2));return;}
  if(p&&/(Lv\d+の効果|忍転身|柳生Lv2で|破れ|合図|スタンバイ能力|登場時)/.test(s)&&!/捨てなかった|効果：.*ない$/.test(s))return push(()=>ability(p,s.slice(p.name.length+1),ms*2));
}
function push(f){FX.q.push(f);if(!FX.busy)run();}
async function run(){FX.busy=true;while(FX.q.length){const f=FX.q.shift();try{await f();}catch(e){}}FX.busy=false;const w=FX.waiters;FX.waiters=[];w.forEach(r=>r());}
FX.drain=()=>FX.busy||FX.q.length?new Promise(r=>FX.waiters.push(r)):Promise.resolve();
// G.log に積むたびに演出を作る（エンジンの log と、カード定義側の log の両方がここを通る）
const _setup=setupGame;setupGame=function(){const r=_setup.apply(this,arguments);FX.q=[];if(layer)layer.innerHTML='';
  const arr=G.log;arr.push=function(...xs){const n=Array.prototype.push.apply(this,xs);for(const x of xs)try{fromLog(String(x&&x.s!=null?x.s:x));}catch(e){}return n;};return r;};
// 次の判断の前に演出を待つ（人間・CPUとも）
const _mr=Replay.makeRecorder;Replay.makeRecorder=function(){const w=_mr.apply(this,arguments);
  return new Proxy(w,{get(t,k){const v=t[k];if(typeof v==='function'&&['prepAction','chooseGauge','attack','defend','heavy','chain','pickCards'].includes(k))return async function(...a){await FX.drain();return v.apply(t,a);};return v;}});};
})();
