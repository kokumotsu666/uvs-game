<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UVS Engine — 飛鳥 vs 柳生</title>
<style>
:root{--bg:#14161c;--panel:#1e2129;--panel2:#262a35;--line:#3a3f4d;--fg:#e8e9ee;--dim:#9aa0b0;
 --yo:#d9534f;--in:#3b7dd8;--sen:#d8a62a;--hi:#4caf50;--hiden:#9b59b6;--acc:#f0c15c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.45}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;flex:1}
header button{font-size:12px}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.primary{background:#3a5bbf;border-color:#4a6bd0}
button:disabled{opacity:.4}
.board{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.board.me{background:#1a1d26}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.name{font-weight:700}
.stat{color:var(--dim);font-size:12px}
.stat b{color:var(--fg);font-size:13px}
.chip{display:inline-block;padding:2px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.chip.yo{border-color:var(--yo)}.chip.in{border-color:var(--in)}
.chip.dmg{border-color:#c0392b}
.chip.chain{border-color:#4caf50}.chip.chain.on{background:#1f3a24}.chip.chain.ban{border-color:#e53935;background:#3a1f1f;color:#ff8a80}
.banmsg{margin-top:4px;padding:3px 8px;border-radius:6px;font-size:12px;background:#3a1f1f;border:1px solid #e53935;color:#ff8a80}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.needs span{padding:2px 8px;border-radius:6px;font-size:12px;border:1px solid var(--line)}
.needs .lit{color:#fff;border-color:#4caf50;background:#2e5e35;font-weight:700}.needs .off{opacity:.35}
.arena{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.battle{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;min-height:60px}
.side{flex:1;background:var(--panel2);border-radius:10px;padding:6px;min-height:60px}
.side h4{margin:0 0 4px;font-size:12px;color:var(--dim)}
.side .tot{font-size:18px;font-weight:700}
.hand{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;-webkit-overflow-scrolling:touch}
.card{flex:0 0 auto;width:92px;min-height:88px;border-radius:8px;border:2px solid var(--line);background:#2c3040;padding:5px 6px;font-size:11px;position:relative;cursor:pointer}
.card.small{width:78px;min-height:64px;font-size:10px}
.card .nm{font-weight:700;font-size:12px;line-height:1.2;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:12px}
.card .gp{color:var(--dim)}
.card .ic{color:var(--acc);letter-spacing:1px;font-weight:700}
.card .ty{position:absolute;top:3px;right:5px;font-size:9px;color:var(--dim)}
.card.c閃{border-color:var(--sen)}.card.c陽{border-color:var(--yo)}.card.c陰{border-color:var(--in)}.card.c飛{border-color:var(--hi)}.card.c秘{border-color:var(--hiden)}
.card.sel{box-shadow:0 0 0 3px #fff inset;background:#3a4258}
.card.dis{opacity:.35}
.card.dimu{opacity:.5;filter:saturate(.4)}
.card.back{background:repeating-linear-gradient(45deg,#333 0 6px,#444 6px 12px);border-color:#555}
#actions{padding:10px 10px calc(10px + 44px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);position:sticky;bottom:0;z-index:5}
#actions .title{font-weight:700;margin-bottom:6px}
#actions .btns{display:flex;flex-wrap:wrap;gap:6px}
.log{font-size:12px;color:var(--dim);max-height:120px;overflow:auto;background:var(--panel2);border-radius:8px;padding:6px 8px;white-space:pre-wrap}
.log .hl{color:var(--fg)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:20;overflow:auto;padding:16px}
#overlay.on{display:flex;align-items:center;justify-content:center}
.ov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.ov h2{margin:0 0 10px;font-size:17px}
.ov label{display:block;margin:6px 0}
.ov .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.detail{font-size:13px}
.detail dt{color:var(--dim);font-size:11px;margin-top:6px}
.sup{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;border:1px dashed var(--line);margin-right:4px}
.small{font-size:12px;color:var(--dim)}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}

/* v1.5 UI readability patch: portrait dimensions preserved */
.char-panel{display:flex;align-items:center;gap:8px;margin-top:5px;min-width:0}
.char-identity{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.char-identity .chip{font-weight:700;white-space:nowrap}
.char-numbers{display:flex;gap:5px;flex-shrink:0}
.power{min-width:72px;padding:3px 7px;border-radius:8px;background:#292f3b;border:1px solid #4a5262;text-align:center;font-variant-numeric:tabular-nums}
.power.atk{border-color:#b45d59}.power.def{border-color:#5584bb}
.power.atk .power-label{color:#ff7777}.power.def .power-label{color:#75b7ff}
.power .power-label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:#d4d9e5}
.power .power-num{display:block;font-size:18px;line-height:1.18;font-weight:800;color:#fff}
/* 一の位から回転する桁別オドメーター */
.power .power-num{display:flex;justify-content:center;align-items:center;white-space:nowrap;overflow:hidden}
.power .od-digit{position:relative;display:inline-block;width:.62em;height:1.18em;overflow:hidden;vertical-align:top}
.power .od-strip{display:flex;flex-direction:column;align-items:center;will-change:transform}
.power .od-cell{display:block;height:1.18em;line-height:1.18em;text-align:center}
.power .power-delta{font-size:10px;color:#ffcb82;min-height:12px}
.power.changed{animation:power-pulse .38s ease-out}
@keyframes power-pulse{0%{transform:scale(1.1);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
.hand{scroll-snap-type:x proximity;scroll-padding:8px;gap:8px;padding:9px 2px 10px}
.hand .card{scroll-snap-align:start}
.card{width:104px;min-height:103px;padding:8px 6px 6px;border-radius:9px}
.card .nm{font-size:13px;white-space:normal;overflow:visible;overflow-wrap:anywhere;min-height:28px;padding-right:10px}
.card .st{font-size:13px;font-weight:800;white-space:nowrap}
.card .gp{font-size:11px;line-height:1.35}
.card .ic{font-size:12px}
.card.sel{box-shadow:0 0 0 2px #fff inset,0 0 12px #779bff;background:#3a4258}
.card.small{width:80px;min-height:70px;padding:5px;font-size:10px}
.card.small .nm{font-size:11px;min-height:0}
#actions .hand{max-height:140px}
.battle .tot{font-variant-numeric:tabular-nums}
@media(max-width:375px){.power{min-width:64px;padding:3px 4px}.power .power-num{font-size:16px}.char-panel{gap:4px}.card{width:98px}}
@media(prefers-reduced-motion:reduce){.power.changed{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
'use strict';
/* =========================================================
   UVS Engine (Unlimited VS 再現・汎用エンジン試作)
   閃乱カグラ版ルール + 本チャットでの決定事項
   ========================================================= */
const CONFIG = {
  deckSize:40, startHand:4, drawPerTurn:2, firstTurnDraw:1, firstTurnBattle:false,
  winDamage:5, tieWinner:'attacker', noDefenseAutoHit:true,
  greenDefense:'free',   // 緑の防御: 'free'=条件なしで出せ相手が緑なら無条件成功 / 'needs'=攻撃時と同じ前提条件が必要（満たせば無条件成功） / 'none'=緑は防御に出せない
  blowHeavy:true,        // 吹飛が相手の重撃も封じるか（falseならテキスト無効のみ）
  heavy:{ firstNeedsIcon:false, ignoreGP:true, maxCards:99, endMode:'bothPass' },
};
let UID=0;
const yo=p=>p.gYo.length, inn=p=>p.gIn.length, gaugeAll=p=>[...p.gYo,...p.gIn];
const sleep=ms=>ms>0?new Promise(r=>setTimeout(r,ms)):Promise.resolve();

/* ---------- カード定義 ---------- */
const CARDS={};
function B(name,id,color,gy,gi,at,df,tech,icons,o={}){const ic=[...new Set(icons.split('').map(x=>(x==='C'||x==='A')?'R':x))];CARDS[name]=Object.assign({type:'battle',name,id,color,gp:{yo:gy,in:gi},at,df,dp:1,tech,icons:ic},o);}
function S(name,id,color,gy,gi,o){CARDS[name]=Object.assign({type:'support',name,id,color,gp:{yo:gy,in:gi}},o);}
const D1=p=>{draw(p,1);};
// --- 飛鳥デッキのバトルカード ---
B('凪','B001','閃',1,0,200,400,'斬撃','C',{text:'【強化】「凪」の連撃から使用時AT+200（※原文未判読のため推定）',mod:c=>c.chainFrom&&c.chainFrom.name==='凪'?{at:200}:null});
B('省刃','B006','閃',0,1,300,300,'斬撃','U',{text:'（テキストなし）'});
B('連刃','B009','閃',0,1,300,200,'斬撃','C',{text:'【強化】陽・陰ゲージがともに3枚以上の時、DF+300',mod:c=>yo(c.me)>=3&&inn(c.me)>=3?{df:300}:null});
B('飛塵','B011','閃',1,1,300,300,'斬撃','A',{text:'【閃乱】陽・陰ゲージがともに5枚以上の時、DF+500（※もう1つの強化テキストは未判読のため未実装）',mod:c=>yo(c.me)>=5&&inn(c.me)>=5?{df:500}:null});
B('リミットブレイク','B019','閃',3,3,1000,1000,'波動','',{text:'【使用条件】バトル開始時、自分の山札の上から2枚を捨て札にする。【対抗】相手のバトルカードが秘伝忍法の時DF+400。【制限】ディフェンス時、相手はそのバトルで連撃を使用できない',costMill:2,onReveal:c=>{mill(c.me,2,'リミットブレイク');},mod:c=>c.oppCard&&c.oppCard.color==='秘'?{df:400}:null,flags:c=>!c.isAtk?{noOppRenzen:true}:null});
B('砂風車','B020','陽',2,0,300,400,'斬撃','CA',{text:'【対抗】相手が打撃の時DF+200（※条件は推定）',mod:c=>c.oppCard&&c.oppCard.tech==='打撃'?{df:200}:null});
B('捌き連刃','B025','陽',3,0,500,400,'斬撃','CA',{text:'【対抗】相手が防御の時AT+200（※条件は推定）。【陽乱】陽ゲージ5枚以上でAT+200',mod:c=>({at:(c.oppCard&&c.oppCard.tech==='防御'?200:0)+(yo(c.me)>=5?200:0)})});
B('旋空砂','B030','陽',5,0,600,400,'斬撃','CUA',{only:'飛鳥',text:'飛鳥専用。【強化】このバトル中、自分の重撃1枚につきAT+200',mod:c=>({at:200*c.heavy.length})});
B('冥砂','B035','陰',0,2,400,400,'斬撃','C',{text:'【強化】陰ゲージ3枚以上でDF+200（※条件は推定）',mod:c=>inn(c.me)>=3?{df:200}:null});
B('怨砂','B040','陰',0,3,500,500,'斬撃','U',{text:'【強化】「冥砂」の連撃から使用時AT+200。【陰乱】陰ゲージ5枚以上でDF+300',mod:c=>({at:c.chainFrom&&c.chainFrom.name==='冥砂'?200:0,df:inn(c.me)>=5?300:0})});
B('攻断円','B041','陰',0,3,700,300,'斬撃','U',{noHeavy:true,text:'【対抗】アタック時、両プレイヤーは重撃を使用できない。【制限】重撃の効果でバトルに使用できない',flags:c=>c.isAtk?{noHeavyBoth:true}:null});
B('志昇陣','B045','陰',0,5,1000,200,'斬撃','A',{only:'飛鳥',text:'飛鳥専用。【対抗】相手のディフェンスカードが陽属性の時DF+400。【陰乱】陰ゲージ7枚以上でDF+500',mod:c=>({df:(c.oppCard&&c.oppCard.color==='陽'?400:0)+(inn(c.me)>=7?500:0)})});
B('右空','B050','飛',0,0,1000,0,'斬撃','A',{only:'飛鳥',needs:['凪','省刃','飛塵'],text:'飛鳥専用・緑。【使用条件（攻撃時）】忍ゲージに「凪」「省刃」「飛塵」がある。【吹飛】アタック時、相手はバトルカードのテキストと重撃を使用できない（緑を除く）。【連撃防御】ディフェンスに出した時、相手が緑なら無条件で防御成功',flags:c=>c.isAtk?{noOppText:true,noOppHeavy:true}:null});
B('二刀繚斬','B055','秘',4,4,1400,1200,'召喚','',{dp:2,only:'飛鳥',hiden:true,text:'飛鳥専用・秘伝忍法。【使用条件】陽4/陰4、さらに忍ゲージから閃・陽・陰のカードを1枚ずつ捨て札。【強化】忍ゲージの斬撃カード1枚につきAT+100/DF+100。【巻込】勝利時、相手は手札を1枚捨てる',mod:c=>{const n=gaugeAll(c.me).filter(x=>x.tech==='斬撃').length;return{at:100*n,df:100*n}},onWin:c=>oppDiscard(c,1)});
// --- 柳生デッキのバトルカード ---
B('散り傘','B038','陰',0,2,300,400,'打撃','CU',{text:'【強化】このバトル中、重撃で重ねた「散り傘」1枚につきAT+100',mod:c=>({at:100*c.heavy.filter(x=>x.name==='散り傘').length})});
B('狂い傘','B033','陽',5,0,600,400,'射撃','UA',{only:'柳生',text:'柳生専用。【対抗】相手のバトルカードが陰属性の時DF+400。【手札強化】勝利時1ドロー',mod:c=>c.oppCard&&c.oppCard.color==='陰'?{df:400}:null,onWin:c=>{draw(c.me,1);log(`${c.me.name}：狂い傘で1ドロー`)}});
B('踊り傘','B023','陽',2,0,200,200,'射撃','CUA',{text:'【手札強化】勝利時1ドロー',onWin:c=>{draw(c.me,1);log(`${c.me.name}：踊り傘で1ドロー`)}});
B('残月','B043','陰',0,3,600,400,'斬撃','U',{text:'【強化】このバトル中、自分の重撃1枚につきDF+100。【陰乱】陰ゲージ5枚以上でDF+300',mod:c=>({df:100*c.heavy.length+(inn(c.me)>=5?300:0)})});
B('狭朱','B026','陽',3,0,400,300,'斬撃','CUA',{text:'【対抗】ディフェンス時、相手は重撃を使用できない',flags:c=>!c.isAtk?{noOppHeavy:true}:null});
B('天刃','B004','閃',1,0,300,300,'斬撃','U',{text:'（テキストなし）'});
B('零雹','B014','閃',1,1,300,300,'波動','A',{text:'【巻込】ディフェンスで勝利時、相手が使用したバトルカードを捨て札にする。【閃乱】陽・陰ゲージがともに5枚以上でDF+500',mod:c=>yo(c.me)>=5&&inn(c.me)>=5?{df:500}:null,onDefWin:c=>{c.bs.oppCardToDiscard=true;log(`零雹：相手のバトルカードは捨て札になる`)}});
B('諸行の音','B053','飛',0,0,1000,0,'斬撃','A',{only:'柳生',needs:['天刃','連刃','零雹'],text:'柳生専用・緑。【使用条件（攻撃時）】忍ゲージに「天刃」「連刃」「零雹」がある。【吹飛】アタック時、相手はバトルカードのテキストと重撃を使用できない（緑を除く）。【連撃防御】ディフェンスに出した時、相手が緑なら無条件で防御成功',flags:c=>c.isAtk?{noOppText:true,noOppHeavy:true}:null});
B('開華','B028','陽',3,0,400,300,'斬撃','CUA',{text:'【強化】このバトル中、重撃で重ねた「開華」1枚につきAT+200。【陽乱】陽ゲージ5枚以上でAT+200',mod:c=>({at:200*c.heavy.filter(x=>x.name==='開華').length+(yo(c.me)>=5?200:0)})});
B('返し雨','B048','陰',0,5,700,300,'斬撃','UA',{only:'柳生',text:'柳生専用。【強化】このバトル中、重撃で重ねた射撃カード1枚につきAT+200。【手札強化】勝利時1ドロー',mod:c=>({at:200*c.heavy.filter(x=>x.tech==='射撃').length}),onWin:c=>{draw(c.me,1);log(`${c.me.name}：返し雨で1ドロー`)}});
B('くぐつダミー','B017','閃',1,1,0,500,'防御','',{dp:0,text:'【対抗】相手が斬撃または打撃の時DF+200。【対抗】相手のバトルカードのDPが2以上の時、そのDP−1',mod:c=>c.oppCard&&['斬撃','打撃'].includes(c.oppCard.tech)?{df:200}:null,dpMod:c=>(!c.isAtk&&c.oppCard&&c.oppCard.dp>=2)?-1:0});
B('薙ぎ払う足','B058','秘',4,4,1300,1300,'召喚','',{dp:2,only:'柳生',hiden:true,text:'柳生専用・秘伝忍法。【使用条件】陽4/陰4、さらに忍ゲージから閃・陽・陰のカードを1枚ずつ捨て札。【強化】手札が5枚以上の時AT+500/DF+500。【巻込】勝利時、相手は手札を1枚捨てる',mod:c=>c.me.hand.length>=5?{at:500,df:500}:null,onWin:c=>oppDiscard(c,1)});
// --- サポート ---
S('緑の巻物','S001','閃',1,1,{text:'【使用型】自分のダメージエリアの枚数だけドロー。効果の適用後、すぐに陰ゲージへ',use:async c=>{const n=c.me.damage.length;draw(c.me,n);log(`${c.me.name}：緑の巻物で${n}ドロー`)},dest:'in',expire:'now'});
S('赤の巻物','S002','閃',2,2,{text:'【使用型】自分のキャラ1枚をダメージエリアへ送り、2ドロー。効果の適用後すぐに忍ゲージへ（※陽・陰どちらかは原文未判読のため選択制）',canUse:p=>p.charDeck.length>=2,use:async c=>{await applyDamage(c.me,1,'赤の巻物');draw(c.me,2);log(`${c.me.name}：赤の巻物で2ドロー`)},dest:'choose',expire:'now'});
S('牛乳','S003','陽',3,3,{text:'【使用型】ダメージエリアにある最もレベルの高いキャラカード1枚をキャラエリアの一番上に戻す。すぐに陽ゲージへ',canUse:p=>p.damage.some(x=>x.type==='char'),use:async c=>{const cs=c.me.damage.filter(x=>x.type==='char').sort((a,b)=>b.lv-a.lv);const ch=cs[0];c.me.damage.splice(c.me.damage.indexOf(ch),1);c.me.charDeck.unshift(ch);log(`${c.me.name}：牛乳で${ch.name}Lv${ch.lv}が戻った（ダメージ${c.me.damage.length}）`);if(ch.onTop)await ch.onTop(c.me);},dest:'yo',expire:'now'});
S('朝食のパン','S006','陽',3,3,{text:'【効力持続】このターン、自分のキャラのAT+300。ターン終了時に陽ゲージへ',use:async c=>{c.me.turnMod.at+=300;log(`${c.me.name}：朝食のパン（このターンAT+300）`)},dest:'yo',expire:'endTurn'});
S('病院の待合室にて','S008','陰',1,1,{text:'【行動制限】次の自分のターン開始時まで、両プレイヤーはバトルを行えない。次の自分のターン開始時、相手は1ドローし、このカードは陰ゲージへ',use:async c=>{G.noBattle={by:c.me.idx};log(`${c.me.name}：病院の待合室にて（次の自分のターンまでバトル禁止）`)},dest:'in',expire:'nextTurnStart'});

const CHARS={

/* ---------- ゲーム状態 ---------- */
let G={}, P=[];
function hook(name,...a){if(G.hooks&&G.hooks[name])return G.hooks[name](...a);}
class GameOver extends Error{}
function log(s,hl){G.log.push({s,hl:!!hl});}
function inst(t){const o=Object.create(t);o.uid=++UID;return o;}
function rm(arr,x){const i=arr.indexOf(x);if(i>=0)arr.splice(i,1);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function draw(p,n){let k=0;for(let i=0;i<n;i++){if(!p.deck.length)break;p.hand.push(p.deck.shift());k++;}return k;}
function toBottom(p,cards,why){for(const x of cards){rm(p.hand,x);p.deck.push(x);}if(cards.length)log(`${p.name}：${why}で手札${cards.length}枚を山札の一番下へ`);}
function mill(p,n,why){for(let i=0;i<n;i++){if(!p.deck.length)break;p.discard.push(p.deck.shift());}log(`${p.name}：${why}で山札の上から${n}枚を捨て札`);}
function charAT(p){return p.charDeck[0].at+p.turnMod.at}
function charDF(p){return p.charDeck[0].df+p.turnMod.df}
function gpOK(p,c){return yo(p)>=c.gp.yo&&inn(p)>=c.gp.in}
function hidenOK(p){return gaugeAll(p).some(x=>x.color==='閃')&&p.gYo.some(x=>x.color==='陽')&&p.gIn.some(x=>x.color==='陰')}
function baseUsable(p,c){if(c.type!=='battle')return false;if(c.only&&c.only!==p.charName)return false;if(!gpOK(p,c))return false;if(c.needs&&!c.needs.every(n=>gaugeAll(p).some(x=>x.name===n)))return false;if(c.hiden&&!hidenOK(p))return false;return true}
function canAttack(p,c,mode){if(c.defOnly)return false;if(mode==='R'){if(c.color!=='飛')return false}else{if(c.color==='飛')return false}return baseUsable(p,c)}
function canDefend(p,c){if(c.type!=='battle')return false;if(c.color==='飛'){if(CONFIG.greenDefense==='none')return false;if(CONFIG.greenDefense==='needs')return baseUsable(p,c);return !c.only||c.only===p.charName;} return baseUsable(p,c)}
function heavyOK(p,c){if(c.type!=='battle'||!c.icons.includes('U')||c.noHeavy)return false;if(c.only&&c.only!==p.charName)return false;if(!CONFIG.heavy.ignoreGP&&!gpOK(p,c))return false;return true}
function lose(p,why){G.over={loser:p.idx,why};log(`★ ${p.name}の敗北（${why}）。${P[1-p.idx].name}の勝利！`,true);throw new GameOver();}
function cardVal(c){return (c.at||0)+(c.df||0)+150*((c.icons||[]).length)+(c.type==='support'?500:0)}

async function applyDamage(p,n,src){
  for(let i=0;i<n;i++){
    if(p.charDeck.length>=2){
      const c=p.charDeck.shift();p.damage.push(c);
      const top=p.charDeck[0];
      log(`${p.name}：${src}で1ダメージ → ${c.name}Lv${c.lv}がダメージエリアへ。現在Lv${top.lv}（${top.at}/${top.df}）ダメージ${p.damage.length}/${CONFIG.winDamage}`);
      if(c.onDamaged)await c.onDamaged(p);
      if(top.onTop)await top.onTop(p);
    }else{
      if(!p.deck.length)lose(p,'山札残数以上のダメージ');
      p.damage.push(p.deck.shift());
      log(`${p.name}：${src}で1ダメージ → 山札の上から1枚がダメージエリアへ（ダメージ${p.damage.length}/${CONFIG.winDamage}、山札${p.deck.length}）`);
      if(!p.deck.length)lose(p,'山札残数以上のダメージ');
    }
    if(p.damage.length>=CONFIG.winDamage)lose(p,`${CONFIG.winDamage}ダメージ`);
  }
}
async function oppDiscard(c,n){const v=c.opp;const k=Math.min(n,v.hand.length);if(!k)return;const cs=await v.ctl.pickCards(v,v.hand,k,`巻込：手札を${k}枚捨ててください`,false);for(const x of cs){rm(v.hand,x);v.discard.push(x)}log(`${v.name}：手札を${k}枚捨てた`);}
async function toGaugeByColor(p,c,why){
  if(c.color==='陽'){p.gYo.push(c);log(`${p.name}：「${c.name}」→陽ゲージ（${yo(p)}）`);}
  else if(c.color==='陰'){p.gIn.push(c);log(`${p.name}：「${c.name}」→陰ゲージ（${inn(p)}）`);}
  else if(c.color==='閃'){const g=await p.ctl.chooseGauge(p,c);(g==='yo'?p.gYo:p.gIn).push(c);log(`${p.name}：「${c.name}」→${g==='yo'?'陽':'陰'}ゲージ（陽${yo(p)}/陰${inn(p)}）`);}
  else {p.discard.push(c);log(`${p.name}：「${c.name}」→捨て札`);}
}
async function payHiden(p,card){
  const paid=[];
  for(const [col,pool,label] of [['閃',gaugeAll(p),'閃'],['陽',p.gYo,'陽'],['陰',p.gIn,'陰']]){
    const cands=pool.filter(x=>x.color===col&&!paid.includes(x));
    let x;
    if(p.ai){x=[...cands].sort((a,b)=>cardVal(a)-cardVal(b))[0];}
    else{const k=await p.ctl.pickCards(p,cands,1,`秘伝「${card.name}」のコスト：捨てる${label}属性のカードを選択`,false);x=k[0]||cands[0];}
    paid.push(x);rm(p.gYo,x);rm(p.gIn,x);p.discard.push(x);
  }
  log(`${p.name}：秘伝忍法のコストで忍ゲージから「${paid.map(x=>x.name).join('」「')}」を捨て札（陽${yo(p)}/陰${inn(p)}）`);
}
async function removeSupport(p,s){rm(p.supports,s);const c=s.card;if(s.dest==='discard'){p.discard.push(c);log(`${p.name}：「${c.name}」→捨て札`);return;}if(s.dest==='choose'){const g=await p.ctl.chooseGauge(p,c);(g==='yo'?p.gYo:p.gIn).push(c);log(`${p.name}：「${c.name}」→${g==='yo'?'陽':'陰'}ゲージ`);}else{(s.dest==='yo'?p.gYo:p.gIn).push(c);log(`${p.name}：「${c.name}」→${s.dest==='yo'?'陽':'陰'}ゲージ`);}}

/* ---------- ターン進行 ---------- */
async function runGame(){
  try{
    let cur=G.first;
    while(true){await turn(cur);cur=1-cur;}
  }catch(e){if(!(e instanceof GameOver)){console.error(e);log('エラー: '+e.message,true);}}
  G.prompt=null;hook('render');hook('gameOver');
}
async function turn(pi){
  const p=P[pi],o=P[1-pi];G.turn++;G.cur=pi;p.flags={};G.bs=null;
  log(`━━ ターン${G.turn}：${p.name}（${p.charName} Lv${p.charDeck[0].lv}）━━`,true);
  if(G.noBattle&&G.noBattle.by===pi){G.noBattle=null;const s=p.supports.find(x=>x.expire==='nextTurnStart');if(s)await removeSupport(p,s);draw(o,1);log(`${o.name}：病院の待合室にての効果で1ドロー`);}
  if(!p.deck.length)lose(p,'ドロー時に山札切れ');
  const n=(G.turn===1)?CONFIG.firstTurnDraw:CONFIG.drawPerTurn;const k=draw(p,n);log(`${p.name}：${k}ドロー（手札${p.hand.length}）`);
  await prep(pi);
  if(!(G.turn===1&&!CONFIG.firstTurnBattle))await battlePhase(pi);
  for(const s of [...p.supports])if(s.expire==='endTurn')await removeSupport(p,s);
  p.turnMod={at:0,df:0};G.noTextTurn=false;G.noChainTurn=false;
  log(`${p.name}：ターン終了`);
  await hook('turnEnd',{turn:G.turn,p:pi});
}
function battleAllowed(pi){return !(G.turn===1&&!CONFIG.firstTurnBattle)&&!G.noBattle}
async function prep(pi){
  const p=P[pi];
  while(true){
    G.phase='prep';
    const gaugeable=p.hand.filter(c=>c.type==='battle'&&['閃','陽','陰'].includes(c.color));
    const sups=p.hand.filter(c=>c.type==='support'&&gpOK(p,c)&&(!c.canUse||c.canUse(p)));
    const opts=[];
    if(!p.flags.gauge&&gaugeable.length)opts.push({value:'gauge',label:'バトルカードをゲージに置く'});
    if(!p.flags.support&&sups.length)opts.push({value:'support',label:'サポートカードを使う'});
    const cur=p.charDeck[0];
    if(cur.standby&&!p.flags.lv5&&cur.standby.ok(p))opts.push({value:'lv5',label:cur.standby.label});
    opts.push({value:'go',label:battleAllowed(pi)?'バトルへ進む':'ターン終了',primary:true});
    const r=await p.ctl.prepAction(p,opts,{gaugeable,sups});
    if(r.type==='gauge'){rm(p.hand,r.card);(r.gauge==='yo'?p.gYo:p.gIn).push(r.card);p.flags.gauge=true;log(`${p.name}：「${r.card.name}」を${r.gauge==='yo'?'陽':'陰'}ゲージに置いた（陽${yo(p)}/陰${inn(p)}）`);}
    else if(r.type==='support'){rm(p.hand,r.card);p.flags.support=true;log(`${p.name}：サポート「${r.card.name}」を使用`);const s={card:r.card,dest:r.card.dest,expire:r.card.expire};p.supports.push(s);await r.card.use({me:p,opp:P[1-pi]});if(s.expire==='now')await removeSupport(p,s);}
    else if(r.type==='lv5'){p.flags.lv5=true;await cur.standby.run(p);}
    else if(r.type==='none'){continue;}
    else break;
    hook('render');
  }
}
async function battlePhase(pi){
  if(G.noBattle){log('病院の待合室にての効果でバトルは行えない');return;}
  let mode=null,from=null;
  while(true){
    const r=await battle(pi,mode,from);
    if(r.ended)break;
    if(r.chain){mode=r.chain;from=r.card;continue;}
    break;
  }
  G.bs=null;
}
function charMod(p,card,oppCard){const ch=p.charDeck[0];const r={at:0,df:0};const a=ch.cmod?ch.cmod(p,card):null;const b=ch.cmodVs?ch.cmodVs(p,card,oppCard):null;for(const m of [a,b])if(m){r.at+=m.at||0;r.df+=m.df||0;}return (r.at||r.df)?r:null;}
function computeTotals(bs){
  const A=bs.atk,D=bs.def;
  const flags={};
  const ctxA={me:A.p,opp:D.p,card:A.card,isAtk:true,oppCard:D.card,heavy:A.heavy,oppHeavy:D.heavy,chainFrom:bs.chainFrom,bs};
  const ctxD=D.card?{me:D.p,opp:A.p,card:D.card,isAtk:false,oppCard:A.card,heavy:D.heavy,oppHeavy:A.heavy,chainFrom:null,bs}:null;
  if(A.card.flags)Object.assign(flags,A.card.flags(ctxA)||{});
  if(A.card.color==='飛'&&!CONFIG.blowHeavy)delete flags.noOppHeavy;
  if(A.p.charDeck[0].aflags)Object.assign(flags,A.p.charDeck[0].aflags(A.p)||{});
  if(G.noTextTurn){A.null=true;flags.noOppText=true;}
  D.null=!!flags.noOppText&&!(D.card&&D.card.color==='飛');
  if(ctxD&&!D.null&&D.card.flags)Object.assign(flags,Object.fromEntries(Object.entries(D.card.flags(ctxD)||{}).map(([k,v])=>[k==='noOppHeavy'?'noAtkHeavy':k==='noOppRenzen'?'noAtkRenzen':k,v])));
  bs.flags=flags;
  const sum=(arr,k)=>arr.reduce((s,x)=>s+(x[k]||0),0);
  let at=charAT(A.p)+A.card.at+sum(A.heavy,'at');let atDetail=[`キャラ${charAT(A.p)}`,`${A.card.name}+${A.card.at}`];
  if(A.heavy.length)atDetail.push(`重撃+${sum(A.heavy,'at')}`);
  const mA=(!A.null&&A.card.mod)?A.card.mod(ctxA):null;if(mA&&mA.at){at+=mA.at;atDetail.push(`効果+${mA.at}`);}
  const cA=!flags.noAtkCharText?charMod(A.p,A.card,D.card):null;if(cA&&cA.at){at+=cA.at;atDetail.push(`破れ+${cA.at}`);}
  let df,dfDetail;
  if(D.card){
    df=charDF(D.p)+D.card.df+sum(D.heavy,'df');dfDetail=[`キャラ${charDF(D.p)}`,`${D.card.name}+${D.card.df}`];
    if(D.heavy.length)dfDetail.push(`重撃+${sum(D.heavy,'df')}`);
    const mD=(!D.null&&D.card.mod)?D.card.mod(ctxD):null;if(mD&&mD.df){df+=mD.df;dfDetail.push(`効果+${mD.df}`);}
    const cD=!flags.noOppCharText?charMod(D.p,D.card,A.card):null;if(cD&&cD.df){df+=cD.df;dfDetail.push(`破れ+${cD.df}`);}
    if(mA&&mA.df){/* attacker df irrelevant */}
  }else{df=charDF(D.p);dfDetail=[`キャラ${charDF(D.p)}`];}
  let dp=A.card.dp;const dpD=(D.card&&!D.null&&D.card.dpMod)?D.card.dpMod(ctxD):0;dp=Math.max(0,dp+dpD);
  bs.at=at;bs.df=df;bs.dp=dp;bs.atDetail=atDetail;bs.dfDetail=dfDetail;bs.ctxA=ctxA;bs.ctxD=ctxD;
  return bs;
}
async function battle(pi,mode,from){
  const p=P[pi],o=P[1-pi];
  const usable=p.hand.filter(c=>canAttack(p,c,mode));
  G.phase='battle';G.bs=null;
  if(mode&&!usable.length){log(`${p.name}：連撃の追加バトルに出せる緑カードがない`);return{ended:true};}
  if(!usable.length){log(`${p.name}：アタックに使えるカードがない`);hook('stat',{t:'noatk',p:pi,turn:G.turn,hand:p.hand.length});return{ended:true};}
  const atkCard=await p.ctl.attack(p,usable,mode);
  hook('stat',{t:'atk',p:pi,turn:G.turn,mode,options:usable.filter(c=>c.dp>0).length,hand:p.hand.length,chosen:!!atkCard});
  if(!atkCard){log(`${p.name}：バトルを行わない`);return{ended:true};}
  rm(p.hand,atkCard);
  const bs={atk:{p,card:atkCard,heavy:[]},def:{p:o,card:null,heavy:[]},chainFrom:from,mode,stage:'def'};G.bs=bs;
  log(`${p.name}：${mode?'【連撃】追加バトル ':''}アタック宣言（カードを裏向きで提出）`);
  hook('render');
  const dUsable=o.hand.filter(c=>canDefend(o,c));
  const reach=dUsable.filter(c=>c.color==='飛'||charDF(o)+c.df>=charAT(p)+atkCard.at).length;
  hook('stat',{t:'def',p:1-pi,turn:G.turn,mode,options:dUsable.length,reach,hand:o.hand.length,atkAT:charAT(p)+atkCard.at});
  const defCard=dUsable.length?await o.ctl.defend(o,dUsable,{attacker:p,mode}):null;
  if(defCard){rm(o.hand,defCard);bs.def.card=defCard;}
  bs.stage='reveal';
  log(`公開：${p.name}「${atkCard.name}」(+${atkCard.at}/+${atkCard.df}) vs ${o.name}${defCard?`「${defCard.name}」(+${defCard.df}DF)`:'：ディフェンスなし'}`,true);
  if(defCard&&o.charDeck[0].onGuard&&defCard.tech==='防御')await o.charDeck[0].onGuard(o,defCard);
  // コスト
  for(const [pp,c] of [[p,atkCard],[o,defCard]]){
    if(!c)continue;
    if(c.hiden)await payHiden(pp,c);
    if(c.onReveal)c.onReveal({me:pp,opp:pp===p?o:p});
  }
  let success;
  if(defCard&&defCard.color==='飛'&&atkCard.color==='飛'){
    computeTotals(bs);success=false;bs.stage='result';
    log(`【連撃防御】${o.name}は緑「${defCard.name}」で受けた → 相手が緑なので無条件で防御成功`,true);
  }else if(!defCard&&CONFIG.noDefenseAutoHit){
    computeTotals(bs);success=true;bs.stage='result';
    log(`ディフェンスなし → アタック成功（確定ヒット）`);
  }else{
    computeTotals(bs);
    // 重撃
    bs.stage='heavy';
    let who=0,passes=0,count=0;

/* ---------- コントローラ：CPU ---------- */
// 重撃の判断（純粋関数。実戦とシミュレーションで共用）
function isCounterDeck(p){return p.deckKey==='雲雀・反撃'||p.deckKey==='雲雀・LO';}
// Shared resource parameters. Stage 1 preserves all historical arithmetic/order.
const CPU_RESOURCES=(()=>{
  const defaults=Object.freeze({
    shared:false,drawMode:'classic',panicBuffer:4,panicValue:-1000,
    softHand:5,hardHand:7,baseGain:220,softGain:90,hardGain:35,
    nearDeck:10,nearDrawCost:160,normalDrawCost:25,drawOverhead:110,
    lowDeck:6,lowDeckPremium:200,
    guardHandBonus:0,heavyHandBonus:0,guardReserve:0,heavyReserve:0,
    attackFailure:0,shortHand:3,shortHandPenalty:0,finishMultiplier:0,guardSuccess:0,
    attackMinHand:2,defenseMinHand:2,attackBudget:1,defenseBudget:1,preserveFinalGuard:false,
  });
  const overrides=Object.freeze({
    '雲雀・反撃':Object.freeze({drawMode:'bounded',guardHandBonus:0.9,heavyHandBonus:0.4,
      guardReserve:300,heavyReserve:140,attackFailure:350,shortHandPenalty:250,
      finishMultiplier:1,guardSuccess:120,attackMinHand:3,defenseMinHand:1,
      attackBudget:0,defenseBudget:1,preserveFinalGuard:true}),
  });
  const profiles=Object.fromEntries(Object.entries(overrides).map(([k,v])=>[k,Object.freeze({...defaults,...v})]));
  function profile(p){return profiles[p.deckKey==='雲雀・LO'?'雲雀・反撃':p.deckKey]||defaults;}
  function drawValue(p,n,unit=220){
    const r=profile(p);
    if(r.drawMode==='classic')return n*unit-unit*0.5;
    if(p.deck.length<=n+r.panicBuffer)return r.panicValue;
    const handAfter=p.hand.length-1;
    const gain=handAfter>=r.hardHand?r.hardGain:handAfter>=r.softHand?r.softGain:r.baseGain;
    return n*(gain-(p.deck.length<=r.nearDeck?r.nearDrawCost:r.normalDrawCost))-r.drawOverhead;
  }
  function deckCost(p,unit){const r=profile(p);return unit+(p.deck.length<=r.lowDeck?r.lowDeckPremium:0);}
  function handCost(p,n,unit){return n*unit;}
  function reserve(p,c){const r=profile(p);return c.tech==='防御'?r.guardReserve:c.icons.includes('U')?r.heavyReserve:0;}
  return {defaults,overrides,profile,drawValue,deckCost,handCost,reserve};
})();
function counterDrawValue(p,n){return CPU_RESOURCES.drawValue(p,n);}
function heavyPolicy(p,o,elig,ctx,committed,hp){
  if(isCounterDeck(p)&&!(hp&&hp.counterDisabled)){
    const r=CPU_RESOURCES.profile(p);
    hp=Object.assign({},hp,{minHand:ctx.isAtk?r.attackMinHand:r.defenseMinHand,budgetExtra:ctx.isAtk?r.attackBudget:r.defenseBudget});
    // Keep the last dedicated guard for the next enemy turn unless this hit wins.
    if(r.preserveFinalGuard&&ctx.isAtk&&o.damage.length+ctx.dp<CONFIG.winDamage){
      const guards=p.hand.filter(c=>c.tech==='防御');
      if(guards.length===1)elig=elig.filter(c=>c!==guards[0]);
      if(!elig.length)return null;
    }
  }
  hp=hp||{minHand:2,budgetExtra:1};
  const losing=ctx.isAtk?ctx.at<ctx.df:ctx.df<=ctx.at;
  if(!losing)return null;
  if(ctx.dp<=0)return null;                       // ダメージのないバトルには投資しない
  const lethal=ctx.isAtk?(o.damage.length+ctx.dp>=CONFIG.winDamage):(p.damage.length+ctx.dp>=CONFIG.winDamage);
  const budget=lethal?99:ctx.dp+hp.budgetExtra;    // このバトルに使う重撃の枚数上限
  const minHand=lethal?0:hp.minHand;              // 残しておく手札
  if(committed>=budget||p.hand.length-1<minHand)return null;
  const key=ctx.isAtk?'at':'df';
  const gap=ctx.isAtk?ctx.df-ctx.at:ctx.at-ctx.df+100;
  const sorted=[...elig].sort((a,b)=>a[key]-b[key]);
  const enough=sorted.find(c=>c[key]>=gap);       // 足りる中で最小の札
  if(enough)return enough;
  const best=sorted[sorted.length-1];
  const rest=p.hand.filter(c=>c!==best&&heavyOK(p,c)).sort((a,b)=>b[key]-a[key]).slice(0,budget-committed-1);
  const potential=best[key]+rest.reduce((s,c)=>s+c[key],0);
  if(potential>=gap&&p.hand.length-1-rest.length>=minHand)return best;
  return null;
}
const AI={
  async prepAction(p,opts,ctx){
    await sleep(G.delay);
    const has=v=>opts.some(o=>o.value===v);
    if(has('support')){
      const o=P[1-p.idx];
      const pick=ctx.sups.find(c=>c.name.startsWith('牛乳')&&p.damage.length>=2)||ctx.sups.find(c=>c.name==='緑の巻物'&&p.damage.length>=2)||ctx.sups.find(c=>c.name==='朝食のパン'&&p.hand.some(c2=>canAttack(p,c2,null)))||ctx.sups.find(c=>c.name==='病院の待合室にて'&&p.damage.length>=3&&p.hand.length<=3)||ctx.sups.find(c=>c.name==='赤の巻物'&&p.damage.length<=1)||ctx.sups.find(c=>c.name==='緑の巻物'&&p.damage.length>=1);
      if(pick)return{type:'support',card:pick};
    }
    if(has('gauge')){
      // 方針：使える技は置かずに攻撃に使う。ゲージに置くのは今使えない札だけ
      const needs=new Set();for(const c of [...p.hand,...p.deck])if(c.needs)c.needs.forEach(n=>needs.add(n));
      const have=new Set(gaugeAll(p).map(x=>x.name));
      const usableAtk=p.hand.filter(c=>c.type==='battle'&&baseUsable(p,c)&&c.color!=='飛'&&c.dp>0);
      const dist=c=>Math.max(0,c.gp.yo-yo(p))+Math.max(0,c.gp.in-inn(p));   // 使用条件までの距離
      let pool=ctx.gaugeable.filter(c=>!(baseUsable(p,c)&&c.dp>0));
      // 例外：序盤で攻撃できる札がまったく無いときは、最も軽い札を置いてゲージを作る
      if(!pool.length&&!usableAtk.length)pool=ctx.gaugeable;
      if(!pool.length)return has('lv5')?{type:'lv5'}:{type:'go'};
      const score=c=>{
        let s=cardVal(c)-200*Math.min(dist(c),4);                // 条件から遠い札ほど置きやすい
        if(c.dp===0)s-=300;
        if(needs.has(c.name)&&!have.has(c.name)){const dup=p.hand.filter(x=>x.name===c.name).length;s-=(dup>=2||usableAtk.length>=3)?1500:300;}
        if(c.color==='秘'||c.color==='飛')s+=5000;
        return s;};

    }

    return{type:'go'};
  },
  async chooseGauge(p,card){
    // 手札のカードが要求するゲージを優先、同じなら少ない方
    let wy=0,wi=0;for(const c of p.hand){if(c.gp){wy+=Math.max(0,c.gp.yo-yo(p));wi+=Math.max(0,c.gp.in-inn(p));}}
    if(wy!==wi)return wy>wi?'yo':'in';return yo(p)<=inn(p)?'yo':'in';
  },
  // 相手が防御に出せる見込みのDF（キャラ＋防御札＋重撃の余力）
  oppBlock(p,o){const h=o.hand.length;return charDF(o)+(h>0?400:0)+Math.min(Math.max(h-1,0),2)*300;},
  estAT(p,c){let m=0;try{const r=c.mod?c.mod({me:p,opp:P[1-p.idx],card:c,isAtk:true,oppCard:null,heavy:[],oppHeavy:[],chainFrom:null,bs:{}}):null;m=(r&&r.at)||0;}catch(e){}const cm=p.charDeck[0].cmod?p.charDeck[0].cmod(p,c):null;return charAT(p)+c.at+m+((cm&&cm.at)||0);},
  async attack(p,usable,mode){
    await sleep(G.delay);
    const o=P[1-p.idx];
    const block=this.oppBlock(p,o);
    let cand=usable.filter(c=>c.dp>0&&c.tech!=='防御');   // 防御札（DP0）では原則攻撃しない
    // 例外：序盤でゲージが育っておらず、ほかに攻撃札がない時はゲージ作りとして使う
    if(!cand.length&&!mode&&yo(p)+inn(p)<4)cand=usable.filter(c=>c.tech==='防御'||c.dp===0);
    if(!cand.length)return null;
    const hid=cand.filter(c=>c.color==='秘');
    const normal=cand.filter(c=>c.color!=='秘');
    // 秘伝：相手の手札が尽きているか、重撃込みでも届く見込みがある時だけ
    if(hid.length){const h=hid[0];const at=this.estAT(p,h);if(o.hand.length<=1||at>=block+300)return h;}
    const score=c=>this.estAT(p,c)+(c.icons.includes('C')?150:0)+(c.icons.includes('A')&&p.hand.some(x=>x.color==='飛')?250:0);
    const list=(normal.length?normal:cand).sort((a,b)=>score(b)-score(a));
    return list[0];
  },
  async defend(p,usable,info){
    await sleep(G.delay);
    const o=info.attacker;const threat=charAT(o)+500;
    const green=usable.filter(c=>c.color==='飛');
    if(info.mode==='R'){ // 連撃：緑（+1000・吹飛）が来る。緑で受ければ無条件成功、なければ素のDFで届く札だけ
      if(green.length)return green[0];
      const need=charAT(o)+1000;
      const cands=usable.filter(c=>c.color!=='飛'&&charDF(p)+c.df>=need).sort((a,b)=>a.df-b.df);
      return cands[0]||null;
    }
    const normal=usable.filter(c=>c.color!=='飛');   // 通常バトルで緑を出しても意味がない
    if(!normal.length)return null;
    const best=[...normal].sort((a,b)=>(b.df)-(a.df))[0];
    const myDF=charDF(p)+best.df;
    const heavyDF=p.hand.filter(c=>c!==best&&heavyOK(p,c)).reduce((s,c)=>s+c.df,0);
    if(myDF>=threat-100)return best;
    if(p.hand.length>=4&&myDF+heavyDF>=threat)return best;

  },
  async heavy(p,elig,ctx){

  async chain(p,avail){
    await sleep(G.delay);
    const o=P[1-p.idx];
    const block=charDF(o)+(o.hand.length>0?400:0);
    const ok=ic=>{const cs=p.hand.filter(c=>canAttack(p,c,ic)&&c.dp>0);if(!cs.length)return false;const best=Math.max(...cs.map(c=>this.estAT(p,c)));if(o.hand.length===0)return true;return best>=charDF(o)+(this.chainMargin??400);};

    if(title.startsWith('入れ替え')||title.startsWith('山札の下へ')){const bad=cards.filter(c=>!baseUsable(p,c)&&c.type==='battle'&&(c.gp.yo-yo(p)+c.gp.in-inn(p))>=3);const pick=bad.slice(0,n);if(pick.length||allowLess)return pick;return [...cards].sort((a,b)=>cardVal(a)-cardVal(b)).slice(0,n);}

    return [...cards].sort((a,b)=>cardVal(a)-cardVal(b)).slice(0,n);
  },
};

function setupGame(opts){

  P=[0,1].map(i=>{const dk=opts.decks[i];const p={idx:i,name:`P${i+1}`,deckKey:dk,charName:DECKS[dk].char,ai:!!opts.ai[i],turnMod:{at:0,df:0},flags:{},supports:[],hand:[],discard:[],damage:[],gYo:[],gIn:[]};
    p.ctl=opts.ctls[i];p.charDeck=CHARS[dk].map(c=>{const o=inst(c);o.type='char';return o;});

  G.first=(opts.first==='random'||opts.first==null)?Math.floor(RNG()*2):+opts.first;
  const who=opts.ctlLabels?`、操作: P1=${opts.ctlLabels[0]}／P2=${opts.ctlLabels[1]}`:'';log(`ゲーム開始（ルールv2：連撃・緑防御・秘伝1ハンデス）：P1=${opts.decks[0]}デッキ、P2=${opts.decks[1]}デッキ（山札${P[0].deck.length+CONFIG.startHand}枚）。先攻は${P[G.first].name}${who}`,true);
  return {G,P};
}

<script>
'use strict';
/* =========================================================
   Solver: バトル層の混合戦略（情報集合サンプリング + 後悔最小化）

const W = {            // 評価の重み（段階3で自己対戦により調整する）
  dmg:1000,            // 1ダメージ
  lethal:6000,         // 決着
  hand:220,            // 手札1枚
  gauge:60,            // ゲージ1枚（閾値未満のときは価値が上がる）
  gaugeNeed:120,       // 手札の技の条件に足りないゲージ1枚

// 相手の手札を情報集合からサンプリング（相手の山札＋手札の中身は区別できない）
function sampleHand(o){

function vplayer(p,hand){const v=Object.create(p);v.hand=hand;return v;}

// 利得表から混合戦略（後悔最小化）
function solveMatrix(M){ // M[i][j] 行プレイヤーの利得。列プレイヤーはその負

  for(let s=0;s<useS().samples;s++){
    const oh=sampleHand(o);const d=vplayer(o,oh);
    const defs=oh.filter(c=>canDefend(d,c));
    const names=[...new Set(defs.map(c=>c.name))];

// 防御側の判断：行＝自分の防御札（＋なし）、列＝相手の攻撃札（名前）

// ---------- ターン層：手札の使いやすさを評価する関数 ----------
function distGP(p,c,extraYo,extraIn){return Math.max(0,c.gp.yo-(yo(p)+extraYo))+Math.max(0,c.gp.in-(inn(p)+extraIn));}

    if(c.color==='秘'){const d=distGP(p,c,extraYo,extraIn);u+=W_.hand*1.6/(1+d);continue;}
    const d=distGP(p,c,extraYo,extraIn);
    let v=cardVal(c)/600*W_.hand;                 // 素の価値（基準600で手札1枚分）
    if(c.icons.includes('U'))v+=W_.hand*0.5;       // 重撃札はGP無視で使えるので常に価値あり
    if(c.dp===0)v*=0.6;

  }
  // 山札にある緑の前提札が揃う価値（将来の連撃）
  for(const c of p.deck)if(c.color==='飛'&&(!c.only||c.only===p.charName)){const have=c.needs.filter(n=>gaugeNames.has(n)).length;u+=W_.hand*0.15*have;}

}
function supportValue(p,o,c){
  const W_=useW();const n=c.name;
  if(n.startsWith('緑の巻物'))return CPU_RESOURCES.drawValue(p,p.damage.length,W_.hand);
  if(n.startsWith('赤の巻物'))return (p.charDeck.length>=2&&p.damage.length<=2)?2*W_.hand-dmgValue(p,1)*0.9:-1;
  if(n.startsWith('牛乳'))return p.damage.some(x=>x.type==='char')?dmgValue(p,1)*0.9-W_.hand*0.3:-1;

  if(n.startsWith('病院の待合室'))return (p.damage.length>=3&&p.hand.length<=3)?W_.dmg*0.5-W_.hand:-1;

// 入れ替え候補: 手札から外しても手札効用がほとんど落ちない札（死に札）を、落ち幅の小さい順に返す
function swapCandidates(p,hand,maxN,required){
  const W_=useW();const base=handUtility(p,hand,0,0,[]);
  const scored=hand.map(c=>({c,loss:base-handUtility(p,hand.filter(x=>x!==c),0,0,[])})).sort((a,b)=>a.loss-b.loss);
  // 閾値: 手札1枚の価値の35%未満しか貢献していない札だけを戻す（必須指名なら最小損失の1枚）
  const th=W_.hand*(cur&&cur.swapTh!=null?cur.swapTh:0.6);
  let out=scored.filter(x=>x.loss<th).slice(0,maxN).map(x=>x.c);

const TurnLayer={
  async prepAction(p,opts,ctx){

  async pickCards(p,cards,n,title,allowLess){
    if(/^Lv3の効果：捨てる/.test(title)){ // 飛鳥v4: 手札効用の落ちが最小の札。緑は追加の1ドロー分だけ損失を軽く見る
      cur=this;const W_=useW();const base=handUtility(p,cards,0,0,[]);
      const o=E.P[1-p.idx];const greens=cards.filter(x=>x.type==='battle'&&x.color==='飛').length;
      // 手札効用はサポートと緑の価値を含まないので、別に足す（サポート＝使ったときの価値、緑＝連撃の決め手。2枚目以降は軽く）

      const sc=cards.map(c=>({c,loss:base-handUtility(p,cards.filter(x=>x!==c),0,0,[])+extra(c)-bonus(c)})).sort((a,b)=>a.loss-b.loss);

    if(this.trace)this.trace.push({kind:'chain',turn:E.G.turn,p:p.idx,value:Math.round(r.value),keep});

};

function makeSolver(params){

  inst.W=Object.assign({},W,params&&params.W||{});

let cur=null; // 現在判断中のソルバー（評価重みの参照用）

const SolverProto={
  name:'solver',
  async heavy(p,elig,ctx){const bs=E.G.bs;const side=ctx.isAtk?bs.atk:bs.def;return heavyPolicy(p,E.P[1-p.idx],elig,ctx,side.heavy.length,this.hp);},
  async attack(p,usable,mode){
    cur=this;
    const o=E.P[1-p.idx];

    if(!list.length)return null;

    if(this.trace)this.trace.push({kind:'atk',turn:E.G.turn,p:p.idx,rows:r.rows.map(c=>c?c.name:'攻撃しない'),probs:r.probs.map(x=>+x.toFixed(2)),value:Math.round(r.value)});
    return r.choice;
  },
  async defend(p,usable,info){
    cur=this;
    const o=info.attacker;
    const r=solveDefend(p,o,usable,info.mode||null);
    if(this.trace&&r.probs)this.trace.push({kind:'def',turn:E.G.turn,p:p.idx,rows:r.rows.map(c=>c?c.name:'出さない'),probs:r.probs.map(x=>+x.toFixed(2))});

};
/* 判断の評価（比較ツール用）: 局面と選択肢を受け取り、選択肢ごとの価値を返す
   kind: 'solved' = 利得表から算出（単位は評価点、1ダメージ=1000）
         'util'   = 手札効用の差分（ゲージ置き・閃の行き先・サポート）
         'heur'   = 経験則（重撃・カード選択）。推奨だけ返し価値は出さない */
async function assess(method,p,a,ctl){
  cur=ctl||Solver;const o=E.P[1-p.idx];const nm=c=>c?c.name:'（なし）';
  if(method==='attack'){const [usable,mode]=a;const cand=usable.filter(c=>c.dp>0&&c.tech!=='防御');const list=cand.length?cand:(!mode&&yo(p)+inn(p)<4?usable:[]);
    if(!list.length)return{kind:'solved',options:[{key:'-',label:'攻撃しない',v:0}]};
    const r=solveAttack(p,o,list,mode);return{kind:'solved',options:r.rows.map((c,i)=>({key:c?String(c.uid):'-',label:nm(c)+(c?'':''),v:r.rowValues[i],pr:r.probs[i]}))};}
  if(method==='defend'){const [usable,info]=a;const r=solveDefend(p,info.attacker,usable,info.mode||null);
    if(!r.probs)return{kind:'solved',options:r.rows.map(c=>({key:c?String(c.uid):'-',label:c?nm(c):'出さない',v:0}))};
    return{kind:'solved',options:r.rows.map((c,i)=>({key:c?String(c.uid):'-',label:c?nm(c):'出さない',v:r.rowValues[i],pr:r.probs[i]}))};}
  if(method==='chain'){const usable=p.hand.filter(c=>canAttack(p,c,'R')&&c.dp>0);const bs=E.G.bs;const card=bs.atk.card;const keep=(card.color==='飛'||card.color==='秘')?0:gaugeValue(p,card);
    if(!usable.length)return{kind:'solved',options:[{key:'-',label:'宣言しない',v:keep}]};
    const r=solveAttack(p,o,usable,'R');return{kind:'solved',options:[{key:'R',label:'連撃を宣言',v:r.value},{key:'-',label:'宣言しない（ゲージへ）',v:keep}]};}
  if(method==='prepAction'){const [opts,ctx]=a;const has=v=>opts.some(x=>x.value===v);const out=[{key:'b',label:'バトルへ／終了',v:0}];
    if(has('support'))for(const c of ctx.sups)out.push({key:'s'+c.uid,label:'サポート:'+c.name,v:supportValue(p,o,c)});
    if(has('gauge')){const base=handUtility(p,p.hand,0,0,[]);for(const c of ctx.gaugeable){const rest=p.hand.filter(x=>x!==c);const gs=c.color==='陽'?['yo']:c.color==='陰'?['in']:['yo','in'];for(const g of gs)out.push({key:`g${c.uid}${g==='yo'?'y':'i'}`,label:`置く:${c.name}→${g==='yo'?'陽':'陰'}`,v:handUtility(p,rest,g==='yo'?1:0,g==='in'?1:0,[c.name])-base});}}
    if(has('lv5')){const r=await TurnLayer.prepAction.call(cur,p,opts.filter(x=>x.value==='lv5'||x.value==='go'),ctx);out.push({key:'l',label:'スタンバイ能力',v:r.type==='lv5'?1:-1,heur:true});}
    return{kind:'util',options:out};}
  if(method==='chooseGauge'){const [card]=a;const rest=p.hand.filter(x=>x!==card);return{kind:'util',options:[{key:'y',label:'陽',v:handUtility(p,rest,1,0,[card.name])},{key:'i',label:'陰',v:handUtility(p,rest,0,1,[card.name])}]};}
  if(method==='heavy'){const [elig,ctx]=a;const bs=E.G.bs;const side=ctx.isAtk?bs.atk:bs.def;const c=heavyPolicy(p,o,elig,ctx,side.heavy.length,useHP());return{kind:'heur',options:[{key:c?String(c.uid):'-',label:c?nm(c):'パス',v:0,rec:true}]};}

<script>
'use strict';
/* =========================================================
   replay.js: 再現ログ（乱数の種＋全操作）の記録・再生
   - 乱数: mulberry32(seed)
   - 操作: コントローラの各判断を1トークンで記録 "<p><op><arg>"
       p  = プレイヤー番号 0/1
       op = P 準備フェイズ (g<uid>y|i=ゲージ置き, s<uid>=サポート, l=スタンバイ能力, n=やめる, b=バトルへ/終了)
            G 閃カードのゲージ選択 (y/i)
            A 攻撃札 <uid> / - (攻撃しない)
            D 防御札 <uid> / - (防御しない)
            H 重撃札 <uid> / - (パス)
            C 連撃宣言 R / -
            K カード選択 <uid>.<uid>… / - (選ばない)
   - 記録は人間・CPUの区別なく全判断を含む。再生は記録を使い切ったら
     元のコントローラ（人間／CPU）に引き継ぐ（＝ログからの再開）
   ========================================================= */
(function(root){
const LOG_VERSION='v1.5';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const ser={
  prepAction:r=>r.type==='gauge'?`g${r.card.uid}${r.gauge==='yo'?'y':'i'}`:r.type==='support'?`s${r.card.uid}`:r.type==='lv5'?'l':r.type==='none'?'n':'b',
  chooseGauge:v=>v==='yo'?'y':'i',
  attack:c=>c?String(c.uid):'-',
  defend:c=>c?String(c.uid):'-',
  heavy:c=>c?String(c.uid):'-',
  chain:v=>v?'R':'-',
  pickCards:cs=>cs.length?cs.map(c=>c.uid).join('.'):'-',
};
const CODE={prepAction:'P',chooseGauge:'G',attack:'A',defend:'D',heavy:'H',chain:'C',pickCards:'K'};
const METHODS=Object.keys(CODE);

// 記録用ラッパー: inner の判断をそのまま返しつつ rec.ops に積む
function makeRecorder(inner,rec,pi){
  const w=Object.create(inner);let depth=0; // 入れ子の呼び出し（prepAction 内の chooseGauge 等）は記録しない。結果は外側の判断に含まれる
  for(const m of METHODS){
    w[m]=async function(p,...a){depth++;let v;try{v=await inner[m].call(this,p,...a);}finally{depth--;}if(depth===0){rec.ops.push(`${pi}${CODE[m]}${ser[m](v)}`);if(rec.onOp)rec.onOp(m,v);}return v;};
  }
  w.name=(inner.name||'ctl')+'+rec';
  return w;
}

// 再生用ラッパー: ops を順に消費し、尽きたら inner に委譲
function makeReplayer(inner,state,pi,onLive){
  const w=Object.create(inner);
  const take=(m)=>{
    if(state.i>=state.ops.length){if(!state.live){state.live=true;if(onLive)onLive();}return null;}
    const t=state.ops[state.i];
    if(+t[0]!==pi||t[1]!==CODE[m])throw new Error(`ログ不整合: ${state.i}番目のトークン「${t}」は P${pi} の ${m} ではない`);
    state.i++;return t.slice(2);
  };
  const find=(cands,uid,what)=>{const c=cands.find(x=>String(x.uid)===uid);if(!c)throw new Error(`ログ不整合: ${what} に uid=${uid} の候補がない`);return c;};
  w.prepAction=async function(p,opts,ctx){const a=take('prepAction');if(a==null)return inner.prepAction.call(this,p,opts,ctx);
    if(a[0]==='g'){const m=a.match(/^g(\d+)([yi])$/);return{type:'gauge',card:find(ctx.gaugeable,m[1],'ゲージ置き'),gauge:m[2]==='y'?'yo':'in'};}
    if(a[0]==='s')return{type:'support',card:find(ctx.sups,a.slice(1),'サポート')};
    if(a==='l')return{type:'lv5'};if(a==='n')return{type:'none'};return{type:'go'};};
  w.chooseGauge=async function(p,card){const a=take('chooseGauge');if(a==null)return inner.chooseGauge.call(this,p,card);return a==='y'?'yo':'in';};
  for(const m of ['attack','defend','heavy']){
    w[m]=async function(p,cands,...rest){const a=take(m);if(a==null)return inner[m].call(this,p,cands,...rest);return a==='-'?null:find(cands,a,m);};
  }
  w.chain=async function(p,avail){const a=take('chain');if(a==null)return inner.chain.call(this,p,avail);return a==='R'?'R':null;};
  w.pickCards=async function(p,cards,n,title,allowLess){const a=take('pickCards');if(a==null)return inner.pickCards.call(this,p,cards,n,title,allowLess);if(a==='-')return[];return a.split('.').map(u=>find(cards,u,title));};
  w.name=(inner.name||'ctl')+'+replay';
  return w;
}

// ログ本文の生成／解析
function cardMap(p){return [...p.charDeck,...p.hand,...p.deck,...p.discard,...p.damage,...p.gYo,...p.gIn,...p.supports.map(s=>s.card)].sort((a,b)=>a.uid-b.uid).map(c=>`${c.uid}=${c.type==='char'?c.name+'Lv'+c.lv:c.name}`).join(',');}
function header(meta,P,CONFIG){
  const cm=meta.cards||P.map(cardMap);
  return [
    `#UVS ${LOG_VERSION} replay`,
    `#legend: token "<p><op><arg>" p=0/1(P1/P2) op: P=準備(g<uid>y|i ゲージ置き, s<uid> サポート, l スタンバイ能力, n やめる, b バトルへ/終了) G=閃のゲージ(y/i) A=攻撃uid(-=なし) D=防御uid(-=なし) H=重撃uid(-=パス) C=連撃(R/-) K=選択uid.uid(-=なし)`,
    `#rules: v2 連撃統合・緑無条件防御・秘伝ハンデス1 deckSize=${CONFIG.deckSize} tie=${CONFIG.tieWinner} noDefenseAutoHit=${CONFIG.noDefenseAutoHit} heavy.ignoreGP=${CONFIG.heavy.ignoreGP} greenDefense=${CONFIG.greenDefense} blowHeavy=${CONFIG.blowHeavy} win=${CONFIG.winDamage}dmg|deckout`,
    `seed=${meta.seed} d0=${meta.decks[0]} d1=${meta.decks[1]} first=${meta.first} c0=${meta.ctl[0]} c1=${meta.ctl[1]}`,
    `cards0: ${cm[0]}`,
    `cards1: ${cm[1]}`,
  ].join('\n');
}
function build(meta,P,CONFIG,ops){return header(meta,P,CONFIG)+'\nops: '+ops.join(' ');}
function parse(text){
  const m=text.match(/^#UVS (v[\d.]+) replay/m);if(!m)throw new Error('再現ログが見つかりません（#UVS … replay の行がない）');
  if(m[1]!==LOG_VERSION)throw new Error(`版が違います（ログ ${m[1]}、このアプリ ${LOG_VERSION}）。版の違うログは読み込みません`);
  const h=text.match(/^seed=(\d+) d0=(.+?) d1=(.+?) first=([01]) c0=(\S+) c1=(\S+)$/m);if(!h)throw new Error('ヘッダ行（seed=…）が読めません');
  const o=text.match(/^ops:\s*(.*)$/m);
  return{seed:+h[1],decks:[h[2],h[3]],first:+h[4],ctl:[h[5],h[6]],ops:o&&o[1].trim()?o[1].trim().split(/\s+/):[]};
}

const Replay={LOG_VERSION,mulberry32,makeRecorder,makeReplayer,build,parse,CODE,cardMap};
if(typeof module!=='undefined'&&module.exports)module.exports=Replay;else root.Replay=Replay;
})(typeof window!=='undefined'?window:globalThis);

</script>

function animatePowers(){
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('[data-power]').forEach(el=>{
   const from=Number(el.dataset.from),to=Number(el.dataset.to);
   if(from===to||reduced)return;
   // 右端の一の位から順番に桁を回す。各桁は必ず最終的な数字で止まる。
   const direction=to>from?1:-1;
   const a=String(Math.abs(Math.trunc(from))),b=String(Math.abs(Math.trunc(to)));
   const digits=Math.max(a.length,b.length);
   const before=a.padStart(digits,'0'),after=b.padStart(digits,'0');
   el.textContent='';el.setAttribute('aria-label',String(to));
   for(let i=0;i<digits;i++){
     const fromDigit=Number(before[i]),toDigit=Number(after[i]);
     const place=digits-1-i;
     const windowEl=document.createElement('span');windowEl.className='od-digit';windowEl.setAttribute('aria-hidden','true');
     const strip=document.createElement('span');strip.className='od-strip';
     // 0～9を複数周並べて、繰り上がり・繰り下がりを自然に見せる。
     for(let n=0;n<40;n++){const cell=document.createElement('span');cell.className='od-cell';cell.textContent=String(n%10);strip.appendChild(cell);}
     windowEl.appendChild(strip);el.appendChild(windowEl);
     const startIndex=20+fromDigit;
     let steps=direction>0?(toDigit-fromDigit+10)%10:(fromDigit-toDigit+10)%10;
     // 上位の桁も変化したときは下位の桁を一周させる。
     if(steps===0&&place===0)steps=10;
     const endIndex=startIndex+direction*steps;
     const height=1.18;
     strip.style.transform=`translateY(${-startIndex*height}em)`;
     const delay=place*105; // 一の位を先に、十・百・千の位へ
     const duration=480+Math.min(steps,10)*32;
     if(typeof strip.animate==='function'){
       const anim=strip.animate([
         {transform:`translateY(${-startIndex*height}em)`},
         {transform:`translateY(${-endIndex*height}em)`}
       ],{duration,delay,easing:'cubic-bezier(.19,.75,.2,1)',fill:'forwards'});
       anim.onfinish=()=>{strip.style.transform=`translateY(${-endIndex*height}em)`;anim.cancel();};
     }else{
       strip.style.transition=`transform ${duration}ms ease ${delay}ms`;
       requestAnimationFrame(()=>{strip.style.transform=`translateY(${-endIndex*height}em)`;});
     }
   }
 });
}

<p><b>バトル</b>：攻守が裏向きで同時に出して公開。AT≧DFで攻撃成功（同値は攻撃側）。ディフェンスを出さなければ確定ヒット。</p>
<p><b>重撃</b>：1枚目は何でもよく、2枚目以降は重撃アイコン必須。GP条件は無視、枚数無制限。攻撃側から交互に追加し、両者が続けてパスで終了。2枚目以降は＋AT/＋DFのみ有効、バトル後は捨て札。</p>
<p><b>連撃（v2）</b>：連撃アイコンを持つ技で攻撃成功後、手札の緑カードで追加攻撃できる（元のカードは捨て札）。追加攻撃に使えるのは緑のみ。緑にも連撃があれば続けられる。緑の攻撃時使用条件は「忍ゲージに指定カード」。</p>
<p><b>緑による防御（v2）</b>：緑は条件なしでディフェンスに出せる。相手の攻撃札が緑なら無条件で防御成功（連撃はそこで終了）。吹飛の無効化は緑には効かない。通常の攻撃に対して緑を出してもDF+0。</p>
<p><b>秘伝忍法（紫）</b>：陽4/陰4に加え、忍ゲージから閃・陽・陰を1枚ずつ捨てる。DP2。勝利時のハンデスは1枚（v2）。</p>
<p><b>山札</b>：標準30枚（v2）。40枚（原作）も選択可。</p>
<p><b>カードの移動</b>：陽→陽ゲージ、陰→陰ゲージ、閃→どちらか選択、緑・紫→捨て札。GPは消費されない閾値。</p>
<p class="small">※テキストに「推定」とあるカードは、原文を判読できず数値や条件を補っています。カードをタップすると詳細を確認できます。</p>
</div>`);}
function showGameOver(){const o=G.over;if(!o)return;const w=P[1-o.loser];openOv(`<h2>${w.name}（${w.charName}）の勝利！</h2><p>${P[o.loser].name}の敗北：${o.why}</p><p class="small">ターン${G.turn}。ログボタンから全経過を確認できます。</p>`);}

/* ---------- 開始画面 ---------- */
function startScreen(){
  $('#app').innerHTML=`<header><h1>UVS Engine — 固定デッキ5種（v1.3・再現ログ）</h1></header>
  <div class="board"><h3 style="margin:6px 0">Unlimited VS 再現エンジン（試作）</h3>
   <p class="small">リメイク向けルールv2で、固定デッキ5種（飛鳥・連撃／柳生・射撃／斑鳩・対抗封じ／葛城・削り／雲雀・反撃、各30枚＋キャラ5枚）を対戦させます。1台の端末で交代して遊ぶか、CPUと対戦できます。</p>
   <h4>モード</h4>
   <label><input type="radio" name="mode" value="cpu" checked> CPU対戦（あなたがプレイヤー1）</label>
   <label><input type="radio" name="mode" value="hotseat"> 2人対戦（端末を交代）</label>
   <label><input type="radio" name="mode" value="watch"> CPU同士を観戦</label>
   <h4>デッキ</h4>
   <label>プレイヤー1：<select id="d1">${DECK_KEYS.map(k=>`<option value="${k}">${k}</option>`).join('')}</select></label>
   <label>プレイヤー2：<select id="d2">${DECK_KEYS.map((k,i)=>`<option value="${k}"${i===4?' selected':''}>${k}</option>`).join('')}</select></label>
   <label>先攻：<select id="first"><option value="random">ランダム</option><option value="0">プレイヤー1</option><option value="1">プレイヤー2</option></select></label>
   <label>CPUの思考：<select id="cpu"><option value="solver" selected>ソルバー（計測と同じ）</option><option value="ai">経験則AI（旧）</option></select></label>
   <label>CPUの待ち時間：<select id="delay"><option value="400">短い</option><option value="900" selected>普通</option><option value="1600">長い</option></select></label>
   <label><input type="checkbox" id="autocopy" ${SETTINGS.autoCopy?'checked':''}> ターン終了ごとにログをクリップボードへ自動コピー（テスト版）</label>
   <div class="btns" style="margin-top:12px"><button class="primary" id="start">ゲーム開始</button><button id="rulesbtn">ルールを見る</button><button id="deckbtn">デッキ内容</button></div>
   <h4>ログから再開</h4>
   <textarea id="resume" rows="3" style="width:100%;box-sizing:border-box;font-size:12px" placeholder="コピーしたログ（#UVS … replay 以降を含む全文）を貼り付け"></textarea>
   <div class="btns"><button id="resumebtn">貼り付けたログから再開</button><span id="resumeerr" class="small"></span></div>
  </div>`;
  $('#start').onclick=()=>{const mode=document.querySelector('input[name=mode]:checked').value;SETTINGS.autoCopy=$('#autocopy').checked;CONFIG.deckSize=30;newGame(mode,$('#d1').value,$('#d2').value,$('#first').value,+$('#delay').value,$('#cpu').value);};
  $('#resumebtn').onclick=()=>{SETTINGS.autoCopy=$('#autocopy').checked;try{const m=Replay.parse($('#resume').value);const mode=m.ctl.every(c=>c!=='H')?'watch':m.ctl.every(c=>c==='H')?'hotseat':'cpu';CONFIG.deckSize=30;newGame(mode,m.decks[0],m.decks[1],m.first,+$('#delay').value,'solver',m);}catch(e){$('#resumeerr').textContent=e.message;}};
  $('#rulesbtn').onclick=showRules;
  $('#deckbtn').onclick=()=>{let h='<h2>固定デッキ内容（各30枚＋キャラ5枚）</h2>';for(const k of DECK_KEYS){const d=DECKS[k];h+=`<h3>${k}</h3><p class="small">${d.note||''}</p><table><tr><th>Lv</th><th>AT/DF</th><th>効果</th></tr>`;for(const c of CHARS[k])h+=`<tr><td>${c.lv}</td><td>${c.at}/${c.df}</td><td class="small">${c.text||'—'}</td></tr>`;h+='</table><table><tr><th>枚</th><th>カード</th><th>色GP</th><th>AT/DF</th><th>ｱｲｺﾝ</th><th>効果</th></tr>';for(const [n,c] of d.list30){const t=CARDS[n];h+=`<tr><td>${c}</td><td>${n}</td><td>${t.color}${t.gp.yo}/${t.gp.in}</td><td>${t.type==='battle'?`+${t.at}/+${t.df}${t.dp!==1?' DP'+t.dp:''}`:'SUP'}</td><td>${t.type==='battle'?t.icons.join(''):'—'}</td><td class="small">${(t.text||'').replace(/【使用条件】.*?。/,'')}</td></tr>`;}h+='</table>';}openOv(h);};
}
function newGame(mode,d1,d2,first,delay,cpu='solver',resume=null){
  CONFIG.deckSize=30;
  const seed=resume?resume.seed:Math.floor(Math.random()*2147483647);
  const rng=Replay.mulberry32(seed);
  const coin=Math.floor(rng()*2); // 先攻が指定でも必ず1回消費し、再開時に山札の並びが変わらないようにする
  if(first==='random'||first==null)first=coin;else first=+first;
  // 座席ごとのコントローラ: H=人間, S=ソルバー, A=経験則AI
  const codes=resume?resume.ctl:[mode==='watch'?(cpu==='solver'?'S':'A'):'H',(mode==='watch'||mode==='cpu')?(cpu==='solver'?'S':'A'):'H'];
  const base=c=>c==='H'?Human:c==='S'?Solver.makeSolver():AI;
  const label=c=>c==='H'?'人間':c==='S'?'CPU(ソルバー)':'CPU(経験則AI)';
  const ai=codes.map(c=>c!=='H');
  REC={ops:[]};
  const rstate=resume?{ops:resume.ops,i:0,live:false}:null;
  const ctls=codes.map((c,i)=>{let ctl=base(c);if(rstate)ctl=Replay.makeReplayer(ctl,rstate,i,()=>{G.replaying=false;render();});return Replay.makeRecorder(ctl,REC,i);});
  setupGame({mode,decks:[d1,d2],ai,ctls,ctlLabels:codes.map(label),first,delay,spectate:mode==='watch',rng,
    hooks:{render:()=>{if(!G.replaying)render();},gameOver:()=>{G.replaying=false;render();showGameOver();autoCopy('決着');},turnEnd:()=>autoCopy(`T${G.turn}終了`),
      showResult:async bs=>{if(G.replaying)return;const humans=P.filter(x=>!x.ai);if(!humans.length){await sleep(G.delay*2);return;}const viewer=G.mode==='hotseat'?G.viewer:humans[0].idx;await uiPrompt(viewer,{title:`${bs.success?'アタック成功':'アタック失敗'}：AT${bs.at} vs DF${bs.df}${(bs.success&&G.noChainTurn&&bs.atk.p===P[G.cur])?`　※${G.noChainBy||'相手の効果'}により、このターンは連撃できません`:''}`,buttons:[{value:'ok',label:'次へ',primary:true}]},false);}}});
  G.meta={seed,decks:[d1,d2],first,ctl:codes,cards:P.map(Replay.cardMap)};
  G.replaying=!!(rstate&&rstate.ops.length);
  if(resume)log(`（ログから再開：操作${resume.ops.length}件を再生）`,true);
  if(mode==='hotseat')G.viewer=G.first;
  render();runGame();
}
startScreen();
</script>
